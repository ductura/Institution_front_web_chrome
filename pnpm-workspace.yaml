# pnpm workspace for the React packages (DAN-750, web 2.c1) and the forbidden
# terms scan of locales (DAN-753, 2.c4-a0). The root skeleton is part of the
# same pnpm install; pnpm-lock.yaml is the only lockfile (DAN-1541), and
# src/client keeps its own, installed with --ignore-workspace, because of the
# scoped registry token.
packages:
  - packages/*
  - catalog
  - scripts/forbidden-terms
  - src/components
  - src/platform
  - src/domain
  - src/app
  - src/lib
  - src/client
