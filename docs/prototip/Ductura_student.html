<style>/* Ductura prototip: tokeni "papir i grafit" (D-188), prepisani iz app/globals.css. */
:root {
  --ground:#242422; --sheet:#2e2e2b; --chrome:#292a28; --ink:#faf9f5; --ink-2:#dedbd3; --ink-3:#c9c5bb;
  --rule:#8c887f; --rule-2:#5a5853; --hover:#3a3a36; --raised:#2e2e2b; --raised-rule:#b3aea3; --card:#33332f;
  --selected:#3a3a36; --well:#3a3a36; --ink-muted:#8c887f; --warn:#e9c58b; --error:#f0a08f;
  --accent:#c8aa6e; --accent-hover:#dcc28a; --accent-ink:#242422; --accent-soft:#3a3a36; --link-rule:#b3aea3;
  --field:#2a2a27; --field-rule:#a6a196; --field-placeholder:#bcb7ac; --error-soft:#3e302b;
  --synced:#a2c6e5; --synced-soft:#24303a; --warn-soft:#3a2f22;
  --cmt:#e9c58b; --cmt-ink:#e9c58b; --cmt-bg:#e9c58b26;
  --radius:6px; --radius-sm:4px; --radius-control:5px; --radius-lg:10px;
  --scrim:#0008; --lift:0 1px 1px #0007, 0 12px 34px -10px #000a;
  --ff-ui:"Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --ff-display:"Newsreader", Georgia, serif;
  --ff-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --gutter-l:max(16px, env(safe-area-inset-left)); --gutter-r:max(16px, env(safe-area-inset-right));
  color-scheme:dark;
}
:root[data-theme="light"] {
  --ground:#f3f2ee; --chrome:#faf9f6; --raised:#faf9f6; --hover:#ecebe5; --selected:#ecebe5; --rule:#cfccc4; --rule-2:#e2e0d9;
  --well:#ecebe5; --ink:#242422; --ink-2:#55534d; --ink-3:#5c5a54; --accent:#806529; --accent-ink:#fcfbf8; --accent-soft:#efe9dc;
  --warn:#7a5420; --synced:#355b81; --sheet:#fcfbf8; --ink-muted:#5c5a54; --accent-hover:#6b5420; --error:#9c3f33;
  --warn-soft:#f3e6cf; --synced-soft:#e3edf6; --cmt:#7a5420; --cmt-ink:#7a5420; --cmt-bg:#e9c58b40;
  --card:#fcfbf8; --raised-rule:#85827a; --link-rule:#8a7550; --field:#fcfbf8; --field-rule:#85827a; --field-placeholder:#5c5a54;
  --error-soft:#f7e4dd; --lift:0 1px 1px #0001, 0 12px 34px -10px #0002; color-scheme:light;
}
/* List: taman (zadano) ili bijeli papir; ne nasljeđuje ljusku. */
.sheet { --sheet:#2e2e2b; --ink:#faf9f5; --ink-2:#dedbd3; --ink-3:#c9c5bb; --rule:#8c887f; --rule-2:#5a5853; --accent:#c8aa6e; --accent-ink:#242422;
  --well:#3a3a36; --card:#33332f; --cmt:#e9c58b; --cmt-ink:#e9c58b; --cmt-bg:#e9c58b26; --link-rule:#b3aea3; color-scheme:dark;
  background:var(--sheet); color:var(--ink); }
.sheet[data-sheet-theme="light"] { --sheet:#fcfbf8; --ink:#242422; --ink-2:#55534d; --ink-3:#5c5a54; --rule:#cfccc4; --rule-2:#f1efea; --accent:#806529; --accent-ink:#fcfbf8;
  --well:#efede7; --card:#fcfbf8; --cmt:#b8862a; --cmt-ink:#8a6420; --cmt-bg:#b8862a26; --link-rule:#8a7550; color-scheme:light; }

*,*::before,*::after { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--ground); color:var(--ink); font:13.5px/1.5 var(--ff-ui); display:grid; grid-template-rows:auto minmax(0,1fr); -webkit-text-size-adjust:100%; }
h1,h2,h3,h4 { font-family:var(--ff-display); font-weight:500; letter-spacing:-0.015em; margin:0; line-height:1.15; }
p { margin:0; } ul,ol { margin:0; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--accent); text-decoration:underline; text-decoration-color:var(--link-rule); text-underline-offset:3px; }
:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
[hidden] { display:none !important; }
input[type="checkbox"] { accent-color:var(--accent); width:18px; height:18px; margin:0; flex:none; }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

/* Traka prototipa: nije dio sučelja proizvoda. */
#proto-bar { display:flex; gap:6px 10px; flex-wrap:wrap; align-items:center; padding:6px var(--gutter-r) 6px var(--gutter-l); background:#1b1b1a; color:#c9c5bb; border-bottom:1px dashed #5a5853; font:11.5px/1.3 var(--ff-mono); }
#proto-bar b { color:#c8aa6e; font-weight:500; text-transform:uppercase; letter-spacing:.06em; }
#proto-bar label { display:inline-flex; gap:5px; align-items:center; }
#proto-bar select, #proto-bar button { font:11.5px var(--ff-mono); background:#2a2a27; color:#faf9f5; border:1px solid #5a5853; border-radius:4px; min-height:30px; padding:0 6px; max-width:46vw; }
#stage { min-height:0; overflow:auto; position:relative; }

/* Zajednički dijelovi */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; font:600 13.5px/1.1 var(--ff-ui); min-height:44px; padding:0 14px; border-radius:5px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); text-decoration:none; }
.btn:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
.btn.secondary { background:transparent; color:var(--ink); border-color:var(--rule); }
.btn.secondary:hover { background:var(--hover); border-color:var(--rule); }
.btn.ghost { background:transparent; color:var(--ink); border-color:transparent; text-decoration:underline; text-decoration-color:var(--link-rule); text-underline-offset:3px; }
.btn.small { padding:0 10px; }
.btn.dense { min-height:32px; padding:0 8px; font-weight:500; }
.btn[aria-disabled="true"], .btn:disabled { background:var(--well); color:var(--ink-3); border-color:var(--rule-2); cursor:not-allowed; }
.input { min-height:44px; padding:6px 10px; border:1px solid var(--field-rule); border-radius:5px; background:var(--field); color:var(--ink); }
.input::placeholder { color:var(--field-placeholder); }
.input[aria-invalid="true"] { border-color:var(--error); }
.input.code { font:15px var(--ff-mono); letter-spacing:.08em; text-transform:uppercase; text-align:center; min-width:0; width:0; flex:1; }
.field { display:grid; gap:4px; } .field label { font-size:12.5px; color:var(--ink-3); }
.err { color:var(--error); font-size:12.5px; } .ok { color:var(--synced); font-size:12.5px; }
.eyebrow, .meta { color:var(--ink-3); font-size:12.5px; }
.note, .lede { color:var(--ink-2); }
.mono { font-family:var(--ff-mono); }
.tag { display:inline-block; font-size:12.5px; font-weight:600; color:var(--ink-2); border:1px solid var(--rule); border-radius:4px; padding:1px 6px; white-space:nowrap; }
.tag.open { border-style:dashed; } .tag.near { border-color:var(--warn); color:var(--ink); }
.card { background:var(--card); border:1px solid var(--rule-2); border-radius:10px; padding:24px; display:grid; gap:12px; width:100%; }
.card.center { text-align:center; justify-items:center; }
.list { display:grid; gap:8px; margin:0; padding:0; list-style:none; }
.item { background:var(--card); border:1px solid var(--rule-2); border-radius:6px; padding:10px 12px; display:grid; gap:6px; min-width:0; }
.item .title { font-weight:600; }
.row { background:var(--card); border:1px solid var(--rule-2); border-radius:6px; padding:10px 12px; display:grid; gap:4px; }
.panel { background:var(--chrome); border:1px solid var(--rule-2); border-radius:10px; overflow:clip; }
.skel { height:12px; border-radius:4px; background:var(--well); animation:skel 1.4s ease-in-out infinite alternate; }
.skel.w40{width:40%} .skel.w60{width:60%} .skel.w80{width:80%}
@keyframes skel { from{opacity:.55} to{opacity:1} }
.dot { width:8px; height:8px; border-radius:50%; background:var(--synced); display:inline-block; flex:none; }
.dot.local { background:transparent; border:2px solid var(--ink-2); }
.facts { margin:0; padding-left:18px; color:var(--ink-2); display:grid; gap:2px; }
.scrim { position:fixed; inset:0; background:var(--scrim); z-index:40; }
.dialog { background:var(--raised); border:1px solid var(--rule); border-radius:10px; padding:16px; display:grid; gap:12px; box-shadow:var(--lift); }
#toast { position:fixed; left:50%; bottom:max(16px, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60; background:var(--raised); color:var(--ink); border:1px solid var(--rule); border-radius:6px; padding:10px 14px; box-shadow:var(--lift); max-width:calc(100vw - 32px); }

/* Ljuska izvan uređivača: bočna traka 64 px (D-202); ispod 800 px gornja crta s "Izbornik". */
.shell { display:grid; grid-template-columns:64px minmax(0,1fr); min-height:100%; }
.side { background:var(--chrome); border-right:1px solid var(--rule-2); padding:14px 4px; display:flex; flex-direction:column; gap:14px; position:sticky; top:0; height:100%; max-height:100vh; align-self:start; }
.side .brand { display:grid; place-items:center; min-height:44px; color:var(--ink); text-decoration:none; font:500 24px/1 var(--ff-display); }
.side .brand .word { display:none; }
.side nav { display:grid; gap:4px; }
.side nav a { display:grid; place-items:center; text-align:center; min-height:44px; padding:6px 2px; border-radius:5px; color:var(--ink-2); text-decoration:none; font-size:11px; line-height:1.2; }
.side nav a:hover { background:var(--hover); }
.side nav a[aria-current="page"] { background:var(--well); color:var(--ink); font-weight:600; }
.side-foot { margin-top:auto; display:grid; gap:6px; }
.side-foot .btn { width:100%; padding:0 2px; font-size:11px; }
.side .menu { display:none; }
.main { width:100%; max-width:880px; margin:0 auto; padding:32px 24px 56px; display:grid; gap:24px; align-content:start; }
.main.narrow { max-width:640px; }
@media (max-width:800px) {
  .shell { grid-template-columns:minmax(0,1fr); grid-template-rows:auto 1fr; }
  .side { flex-direction:row; flex-wrap:wrap; justify-content:space-between; align-items:center; border-right:0; border-bottom:1px solid var(--rule-2); padding:8px var(--gutter-r) 8px var(--gutter-l); height:auto; z-index:5; }
  .side nav, .side-foot { display:none; flex-basis:100%; }
  .side[data-open="true"] nav { display:grid; }
  .side[data-open="true"] nav a { place-items:center start; padding:6px 10px; font-size:13.5px; }
  .side[data-open="true"] .side-foot { display:flex; margin:0; }
  .side[data-open="true"] .side-foot .btn { width:auto; padding:0 12px; font-size:13.5px; }
  .side .brand .mark { display:none; } .side .brand .word { display:inline; font-size:19px; }
  .side .menu { display:inline-flex; }
}
@media (max-width:640px) { .main { padding:20px var(--gutter-r) 40px var(--gutter-l); } .card { padding:16px; } }
</style>

<script>/* Jezgra prototipa: usmjerivač po #imenu, stanje, ljuska, traka prototipa. */
(function () {
  var screens = {}, order = [];
  var App = window.App = {
    data: {
      student: 'Student A', today: '5. 11. 2026.',
      tasks: [
        { id: 't1', course: 'Kolegij A', kind: 'Seminarski rad', title: 'Lokalni mediji i izborna kampanja', due: '8. 11. 2026., 23:59', iso: '2026-11-08', near: 'Rok za 3 dana', mentor: 'Nastavnik A', words: '1.200 do 1.600', ext: { prev: '1. 11. 2026., 23:59', reason: 'tehnicki', scope: 'svi' } },
        { id: 't2', course: 'Kolegij B', kind: 'Esej', title: 'Javna rasprava o školskom kurikulu', due: '15. 1. 2027., 23:59', iso: '2027-01-15', mentor: 'Nastavnik B', words: '1.500 do 2.000' },
        { id: 't3', course: 'Kolegij C', kind: 'Esej', title: 'Esej o povjerenju u institucije', due: '1. 10. 2026., 23:59', iso: '2026-10-01', mentor: 'Nastavnik C', words: '1.000 do 1.500' },
        { id: 't4', course: 'Kolegij D', kind: 'Seminarski rad', title: 'Pregled literature o lokalnoj samoupravi', due: '20. 12. 2026., 23:59', iso: '2026-12-20', mentor: 'Nastavnik D', words: '3.000 do 4.000', hidden: true },
        { id: 't5', course: 'Kolegij B', kind: 'Esej', title: 'Sažetak stručnog članka o medijskoj pismenosti', due: '30. 10. 2026., 23:59', iso: '2026-10-30', mentor: 'Nastavnik B', words: '800 do 1.200' }
      ],
      enrollCode: 'KOL-D-2026',
      todayIso: '2026-11-05',
      // NF-1 / P-1, P-2: obavijesti u zvoncu (izmišljeni podaci). Vrste kao u ugovoru notifications.list.get.
      notifs: [
        { id: 'n1', kind: 'assignment_version', task: 't2', at: '5. 11. 2026., 9:12', read: false },
        { id: 'n2', kind: 'deadline_reminder', task: 't1', at: '5. 11. 2026., 8:00', read: false },
        { id: 'n3', kind: 'comment_posted', task: 't3', at: '3. 11. 2026., 16:40', read: true },
        { id: 'n4', kind: 'submission_recorded', task: 't3', at: '3. 10. 2026., 14:20', read: true },
        { id: 'n5', kind: 'course_handover', course: 'Kolegij C', at: '29. 9. 2026., 11:05', read: true },
        { id: 'n6', kind: 'nova_vrsta_koju_klijent_ne_zna', at: '28. 9. 2026., 10:00', read: false }
      ]
    },
    state: {
      loggedIn: false,
      ack: { t1: true, t3: true, t5: true },          // potvrđena obavijest po zadatku
      started: { t1: true, t3: true },      // rad otvoren
      submitted: { t3: '3. 10. 2026., 14:20' }, // vrijeme poslužitelja pri predaji
      enrolledD: false,
      current: 't1',                         // zadatak koji je otvoren
      sheetTheme: 'dark',
      variant: {},
      bell: 'puno', bellOpen: false,          // NF-1 P-1: stanje zvonca (traka prototipa) i je li ploča otvorena
      workFilter: 'sve', pollOrder: 'rok',     // NF-1 P-4, P-5
      attempts: 0,                             // NF-1 P-10: neuspjeli pokušaji upisa
      notifPrefs: { email: false, push: false, kinds: { version: true, reminder: true, comment: true, submission: false } }
    },
    task: function (id) { id = id || App.state.current; return App.data.tasks.filter(function (t) { return t.id === id; })[0]; },
    visibleTasks: function () { return App.data.tasks.filter(function (t) { return !t.hidden || App.state.enrolledD; }); },
    register: function (name, def) { screens[name] = def; order.push(name); },
    go: function (name) { if (location.hash === '#' + name) render(); else location.hash = name; },
    rerender: function () { render(); },
    variant: function () { var n = current(); return App.state.variant[n] || 'puno'; },
    toast: function (msg) {
      var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
      clearTimeout(App._tt); App._tt = setTimeout(function () { t.hidden = true; }, 3200);
    },
    setTheme: function (th) { document.documentElement.setAttribute('data-theme', th); }
  };
  function current() { var n = location.hash.replace('#', ''); return screens[n] ? n : 'prijava'; }
  var NAV = [['pocetna', 'Moji zadaci'], ['kolegiji', 'Moji kolegiji'], ['radovi', 'Moji radovi'], ['rad', 'Radni prostor'], ['upis', 'Upis u kolegij']];
  function shell(name, inner) {
    return '<div class="shell"><aside class="side" data-open="false">' +
      '<a class="brand" href="#pocetna" aria-label="Ductura, studentska početna"><span class="mark" aria-hidden="true">D</span><span class="word">Ductura</span></a>' +
      (App.shellQuick ? App.shellQuick() : '') +
      '<button class="btn small secondary menu" type="button" data-core="menu" aria-expanded="false">Izbornik</button>' +
      '<nav aria-label="Glavna navigacija">' + NAV.map(function (n) {
        return '<a href="#' + n[0] + '"' + (n[0] === name ? ' aria-current="page"' : '') + '>' + n[1] + '</a>';
      }).join('') + '</nav>' +
      '<div class="side-foot">' + (App.bellButton ? App.bellButton('') : '') + '<button class="btn small secondary" type="button" data-core="theme" aria-label="Promijeni svijetlu ili tamnu temu">◐</button>' +
      '<button class="btn small secondary" type="button" data-core="logout">Odjava</button></div></aside>' + (App.bellRoot ? App.bellRoot() : '') +
      '<main class="main' + (screens[name].narrow ? ' narrow' : '') + '" id="sadrzaj" tabindex="-1">' + inner + '</main></div>';
  }
  function ctx() { return { variant: App.variant(), state: App.state, data: App.data, task: App.task() }; }
  function render() {
    var name = current(), def = screens[name], stage = document.getElementById('stage'), c = ctx();
    var html = def.render(c);
    stage.setAttribute('data-view', name);
    stage.innerHTML = def.shell === 'side' ? shell(name, html) : html;
    stage.scrollTop = 0;
    if (def.after) def.after(stage, c);
    var sv = document.getElementById('proto-view'), ss = document.getElementById('proto-variant');
    sv.innerHTML = order.map(function (n) { return '<option value="' + n + '"' + (n === name ? ' selected' : '') + '>' + (screens[n].title || n) + '</option>'; }).join('');
    var vs = def.variants || [{ id: 'puno', label: 'puno' }];
    ss.innerHTML = vs.map(function (v) { return '<option value="' + v.id + '"' + (v.id === c.variant ? ' selected' : '') + '>' + v.label + '</option>'; }).join('');
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go],[data-act],[data-core]'); if (!el) return;
    if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    var core = el.getAttribute('data-core');
    if (core === 'theme') { App.setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); return; }
    if (core === 'logout') { App.state.loggedIn = false; App.go('prijava'); return; }
    if (core === 'menu') { var s = el.closest('.side'), o = s.getAttribute('data-open') !== 'true'; s.setAttribute('data-open', o); el.setAttribute('aria-expanded', o); return; }
    var act = el.getAttribute('data-act');
    if (act) { var def = screens[current()]; if (def.actions && def.actions[act]) { e.preventDefault(); def.actions[act](el, ctx(), e); } return; }
    var go = el.getAttribute('data-go'); if (go) { e.preventDefault(); App.go(go); }
  });
  document.addEventListener('submit', function (e) {
    var act = e.target.getAttribute('data-submit'); if (!act) return; e.preventDefault();
    var def = screens[current()]; if (def.actions && def.actions[act]) def.actions[act](e.target, ctx(), e);
  });
  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('proto-view').addEventListener('change', function (e) { App.go(e.target.value); });
    document.getElementById('proto-variant').addEventListener('change', function (e) { App.state.variant[current()] = e.target.value; render(); });
    document.getElementById('proto-reset').addEventListener('click', function () { location.hash = 'prijava'; location.reload(); });
    render();
  });
})();
</script>

<style>

.side .quick { display:none; }
#nf-root { display:contents; }
.nf-panel { position:fixed; left:72px; bottom:16px; width:min(380px, calc(100vw - 88px)); max-height:min(70vh, 560px); overflow:auto; z-index:30; align-content:start; }
.nf-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }

<script>
(function () {
  var KIND_LABEL = { assignment_version: 'Nova verzija zadatka', deadline_reminder: 'Podsjetnik na rok', comment_posted: 'Novi komentar', submission_recorded: 'Predaja zabilježena', course_handover: 'Promjena na kolegiju' };
  var OLDER = [
    { id: 'n7', kind: 'deadline_reminder', task: 't3', at: '28. 9. 2026., 8:00', read: true },
    { id: 'n8', kind: 'assignment_version', task: 't3', at: '21. 9. 2026., 13:30', read: true }
  ];
  var more = false, lastFocus = null;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function known(n) { return !!KIND_LABEL[n.kind]; }      // nepoznata vrsta se preskače, ne ruši popis
  function items() { return App.data.notifs.concat(more ? OLDER : []).filter(known); }
  function unread() { return App.state.bell === 'puno' ? items().filter(function (n) { return !n.read; }).length : 0; }
  function task(n) { return n.task ? App.task(n.task) : null; }
  function text(n) {
    var t = task(n);
    if (n.kind === 'assignment_version') return ['Nova verzija zadatka: ' + t.title, 'Nastavnik je objavio novu verziju uputa. Pročitajte je i potvrdite prije nastavka rada.'];
    if (n.kind === 'deadline_reminder') return ['Rok za zadatak ' + t.title + ': ' + t.due, t.course + ' · podsjetnik u aplikaciji'];
    if (n.kind === 'comment_posted') return ['Novi komentar uz rad: ' + t.title, 'Komentar otvorite u radu. Tekst komentara se ne prikazuje u obavijesti.'];
    if (n.kind === 'submission_recorded') return ['Predaja je zabilježena: ' + t.title, 'Potvrdu o predaji možete otvoriti u radu.'];
    return ['Promjena na kolegiju ' + n.course, 'Pogledajte popis kolegija i zadataka.'];
  }
  function btnLabel() { var u = unread(); return 'Obavijesti' + (u ? ', ' + u + ' nepročitano' + (u === 1 ? '' : 'ih') : ''); }
  App.bellButton = function (cls) {
    var u = unread();
    return '<button class="btn small secondary nf-bell-btn ' + (cls || '') + '" type="button" data-nf="bell" aria-haspopup="dialog" aria-expanded="' + !!App.state.bellOpen + '" aria-controls="nf-panel" aria-label="' + btnLabel() + '"><span aria-hidden="true">Obavijesti</span>' + (u ? '<span class="nf-badge" aria-hidden="true">' + u + '</span>' : '') + '</button>';
  };
  App.shellQuick = function () { return '<span class="quick">' + App.bellButton('q') + '<button class="btn small secondary" type="button" data-core="logout">Odjava</button></span>'; };
  function body() {
    var b = App.state.bell;
    if (b === 'ucitavanje') return '<div aria-busy="true" role="status"><span class="nf-sr">Učitavanje obavijesti</span><div class="skel w80"></div><div class="skel w60"></div><div class="skel w40"></div></div>';
    if (b === 'greska') return '<div role="alert"><p class="note">Obavijesti trenutačno nisu dostupne. To ne znači da ih nema.</p><button class="btn small" type="button" data-nf="retry">Pokušaj ponovno</button></div>';
    if (b === 'prazno') return '<p class="note" role="status">Nema novih obavijesti. Ovdje će se prikazati nova verzija zadatka, podsjetnici na rok, komentari i potvrde predaje.</p>';
    var list = items();
    return '<ul class="nf-list" aria-label="Popis obavijesti">' + list.map(function (n) {
      var tx = text(n);
      return '<li><button class="nf-item" type="button" data-nf="open" data-id="' + n.id + '" data-read="' + n.read + '"><b>' + (n.read ? '' : '<span class="dot" aria-hidden="true"></span><span class="nf-sr">Nepročitano: </span>') + esc(tx[0]) + '</b><span class="meta">' + esc(tx[1]) + '</span><span class="meta">' + esc(n.at) + '</span></button></li>';
    }).join('') + '</ul>' + (more ? '' : '<button class="btn small secondary" type="button" data-nf="older" style="justify-self:start">Starije obavijesti</button>');
  }
  App.bellRoot = function () {
    if (!App.state.bellOpen) return '<div id="nf-root"></div>';
    return '<div id="nf-root"><section class="dialog nf-panel" id="nf-panel" role="dialog" aria-labelledby="nf-h" tabindex="-1"><div class="nf-head"><h2 id="nf-h">Obavijesti</h2><button class="btn small secondary" type="button" data-nf="close">Zatvori</button></div>' + body() +
      '<div class="nf-foot"><button class="btn small secondary" type="button" data-nf="readall"' + (App.state.bell === 'puno' && unread() ? '' : ' aria-disabled="true"') + '>Označi sve kao pročitano</button><a href="#postavke" data-go="postavke">Postavke obavijesti</a></div></section></div>';
  };
  function refresh(focusPanel) {
    var root = document.getElementById('nf-root'); if (!root) return;
    root.outerHTML = App.bellRoot();
    Array.prototype.forEach.call(document.querySelectorAll('.nf-bell-btn'), function (b) {
      var q = b.classList.contains('q');
      b.outerHTML = App.bellButton(q ? 'q' : '');
    });
    if (focusPanel) { var p = document.getElementById('nf-panel'); if (p) p.focus({ preventScroll: true }); }
  }
  function visibleBell() { return Array.prototype.filter.call(document.querySelectorAll('.nf-bell-btn'), function (b) { return b.offsetParent !== null; })[0]; }
  function close(restore) {
    if (!App.state.bellOpen) return;
    App.state.bellOpen = false; refresh(false);
    if (restore) { var b = visibleBell(); if (b) b.focus(); }
  }
  App.bellClose = close;
  function open(n) {
    n.read = true; App.state.bellOpen = false;
    var t = task(n), st = App.state;
    if (n.kind === 'assignment_version') { st.current = t.id; st.variant.obavijest = 'promijenjeno'; App.go('obavijest'); }
    else if (n.kind === 'deadline_reminder') { st.current = t.id; App.go(st.submitted[t.id] ? 'potvrda' : !st.ack[t.id] ? 'obavijest' : 'rad'); }
    else if (n.kind === 'comment_posted') { st.current = t.id; App.go(st.submitted[t.id] ? 'potvrda' : 'rad'); }
    else if (n.kind === 'submission_recorded') { st.current = t.id; App.go('potvrda'); }
    else App.go('kolegiji');
    refresh(false);
  }
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-nf]');
    if (!el) { if (App.state.bellOpen && !e.target.closest('#nf-panel') && !e.target.closest('[data-go]')) close(false); return; }
    if (el.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    var a = el.getAttribute('data-nf');
    if (a === 'bell') { App.state.bellOpen = !App.state.bellOpen; refresh(App.state.bellOpen); if (!App.state.bellOpen) { var b = visibleBell(); if (b) b.focus(); } }
    else if (a === 'close') close(true);
    else if (a === 'retry') { App.state.bell = 'ucitavanje'; refresh(false); setTimeout(function () { App.state.bell = 'puno'; syncBar(); refresh(false); }, 600); }
    else if (a === 'older') { more = true; refresh(false); }
    else if (a === 'readall') { App.data.notifs.concat(OLDER).forEach(function (n) { n.read = true; }); refresh(false); App.toast('Sve obavijesti su označene kao pročitane.'); }
    else if (a === 'open') { var id = el.getAttribute('data-id'); App.data.notifs.concat(OLDER).forEach(function (n) { if (n.id === id) open(n); }); }
  });
  document.addEventListener('click', function (e) { if (e.target.closest('#nf-panel [data-go]')) { App.state.bellOpen = false; } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(true); });
  window.addEventListener('hashchange', function () { App.state.bellOpen = false; });
  var BV = [['puno', 'puno, s nepročitanima'], ['prazno', 'prazno'], ['ucitavanje', 'učitavanje'], ['greska', 'greška']];
  function syncBar() { var sel = document.getElementById('proto-bell'); if (sel) sel.value = App.state.bell; }
  document.addEventListener('DOMContentLoaded', function () {
    var sel = document.getElementById('proto-bell'); if (!sel) return;
    sel.innerHTML = BV.map(function (v) { return '<option value="' + v[0] + '">' + v[1] + '</option>'; }).join('');
    sel.value = App.state.bell;
    sel.addEventListener('change', function (e) { App.state.bell = e.target.value; App.state.bellOpen = true; App.rerender(); });
  });
})();
</script>

    var k = kind(t, s), c = 'btn' + (small ? ' small' : ''), d = desc ? ' aria-describedby="' + desc + '"' : '';
    var lab = k === 'obavijest' ? 'Pročitaj upute' : (k === 'rad' || k === 'predano') ? 'Otvori rad' : 'Otvori zadatak';
    return '<button class="' + c + (k === 'predano' || k === 'obavijest' ? ' secondary' : '') + '" type="button" data-act="otvori" data-id="' + t.id + '" aria-label="' + lab + ': ' + esc(t.title) + '"' + d + '>' + lab + '</button>';
  }
  /* NF-1 P-3, P-6, P-7: činjenične oznake roka; nikad tvrdnja o ponašanju studenta. */
  function isoOf(str) { var m = /(\d+)\. (\d+)\. (\d{4})/.exec(str || ''); return m ? m[3] + '-' + (m[2].length < 2 ? '0' : '') + m[2] + '-' + (m[1].length < 2 ? '0' : '') + m[1] : ''; }
  function overdue(t, s) { return !s.submitted[t.id] && t.iso < App.data.todayIso; }
  function afterDue(t, s) { return !!s.submitted[t.id] && isoOf(s.submitted[t.id]) > t.iso; }
  var REASON = { opravdano: 'opravdani razlog', tehnicki: 'tehnički razlog', dogovor: 'dogovor s nastavnikom' };
  function extNote(t) { return t.ext ? '<span class="meta po-ext">Prethodni rok: ' + esc(t.ext.prev) + '. Razlog: ' + REASON[t.ext.reason] + '. Vrijedi za ' + (t.ext.scope === 'svi' ? 'sve studente kolegija' : 'samo Vas') + '.</span>' : ''; }
  function dueTags(t, s) { return (t.near ? '<span class="tag near">' + esc(t.near) + '</span>' : '') + (overdue(t, s) ? '<span class="tag late">Rok je prošao ' + esc(t.due.split(',')[0]) + '</span>' : ''); }
  function when(t, s) {
    var k = kind(t, s);
    if (k === 'predano') return '<span>Predano ' + esc(s.submitted[t.id]) + '</span>' + (afterDue(t, s) ? '<span class="tag late">Predano nakon roka</span>' : '');
    return '<span>' + (t.ext ? 'Produljeni rok: ' : 'Rok: ') + esc(t.due) + '</span>' + dueTags(t, s) + (k === 'obavijest' ? '<span class="tag open">Prvo pročitajte obavijest</span>' : '');
  }
  function task(t, s, withCourse) {
    var k = kind(t, s);
    return '<li class="item po-task"><span>' + (withCourse ? '<span class="eyebrow">' + esc(t.course) + '</span>' : '') + '<span class="title">' + esc(t.title) + '</span><span class="po-when" id="pw-' + t.id + '">' + when(t, s) + '</span>' + (k === 'predano' ? '' : extNote(t)) + '</span>' + btn(t, s, true, 'pw-' + t.id) + '</li>';
  }
  /* NF-1 P-11: isto pravilo kao pri upisu: bez razmaka i crtica, velika slova, najviše 32 znaka. */
  function normCode(v) { return String(v || '').replace(/[\s\-]/g, '').toUpperCase().slice(0, 32); }
  function codeForm(id) {
    return '<form class="po-code" data-submit="kod" novalidate><input class="input code" name="kod" aria-label="Kod kolegija" placeholder="KOD-KOLEGIJA" autocomplete="off" autocapitalize="characters" maxlength="32"><button class="btn" type="submit">Upiši</button></form>';
  }
  function loading() { return '<div class="po-course" aria-busy="true" role="status"><span class="meta" style="position:absolute;left:-9999px">Učitavanje</span><div class="skel w40"></div><div class="item"><div class="skel w80"></div><div class="skel w60"></div></div><div class="item"><div class="skel w80"></div><div class="skel w40"></div></div></div>'; }
  function error() { return '<div class="card po-card" role="alert"><h2>Prikaz trenutačno nije dostupan.</h2><p class="note">Podatke nije bilo moguće učitati. To ne znači da nema kolegija ili radova.</p><button class="btn" type="button" data-act="ponovno" style="justify-self:start">Pokušaj ponovno</button></div>'; }
  function groups(s) {
    var g = [], by = {};
    App.visibleTasks().forEach(function (t) { if (!by[t.course]) { by[t.course] = { name: t.course, tasks: [] }; g.push(by[t.course]); } by[t.course].tasks.push(t); });
    return g;
  }
  function courseCard(c, s) {
    var tags = c.name === 'Kolegij A' ? '<div class="po-tags"><span class="tag">Seminarska grupa 2</span><span class="tag">Seminarska grupa 4</span></div>' : '';
    return '<section class="po-course" aria-label="' + esc(c.name) + '"><span class="eyebrow">Kolegij · 2026./27.</span><h2>' + esc(c.name) + '</h2>' + tags +
      '<ul class="list">' + c.tasks.map(function (t) { return task(t, s, false); }).join('') + '</ul></section>';
  }
  function noCourses() {
    return '<div class="card center po-card"><h2>Još nemate kolegija.</h2><p class="note">Ovdje će se prikazati Vaši kolegiji i njihovi zadaci.</p><h3>Imate kod kolegija?</h3>' + codeForm() +
      '<h3>Što slijedi nakon upisa?</h3><div class="po-steps"><div class="row"><h3>Odaberite zadatak</h3><span class="meta">U svakom kolegiju nastavnik Vam dodjeljuje zadatke.</span></div><div class="row"><h3>Pročitajte upute</h3><span class="meta">Svaki zadatak dolazi s jasnim uputama i očekivanjima.</span></div><div class="row"><h3>Otvorite rad</h3><span class="meta">Nakon što ste spremni, započinjete pisanje u uređivaču.</span></div></div></div>';
  }

  function addDays(iso, n) { var d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function pocetna(ctx) {
    var s = ctx.state, v = ctx.variant, tasks = App.visibleTasks();
    var hero = '<div class="po-hero"><span class="eyebrow">' + esc(ctx.data.today) + '</span><h1>Vaš studentski <em>prostor</em></h1><p class="lede">Zadaci na kolegijima.</p></div>';
    var body;
    if (v === 'ucitavanje') body = loading();
    else if (v === 'greska') body = error();
    else if (v === 'prazno') body = noCourses();
    else if (v === 'kolegijbeztaska') body = ['Kolegij A', 'Kolegij B'].map(function (n) { return '<div class="po-course"><span class="eyebrow">Kolegij</span><h2>' + n + '</h2><p class="note">U ovom kolegiju zasad nema zadatka.</p></div>'; }).join('') + codeCard();
    else {
      /* NF-1 P-4: „nastavak rada” je započeti rad s najbližim rokom, ne prvi po redu. */
      function byDue(a, b) { return a.iso < b.iso ? -1 : a.iso > b.iso ? 1 : 0; }
      var cur = tasks.filter(function (t) { return s.started[t.id] && !s.submitted[t.id] && s.ack[t.id]; }).sort(byDue)[0] ||
                tasks.filter(function (t) { return s.started[t.id] && !s.submitted[t.id]; }).sort(byDue)[0];
      body = '';
      if (cur) body += '<section class="po-continue" aria-labelledby="po-n"><span class="eyebrow">' + esc(cur.kind) + ' · ' + esc(cur.course) + '</span><b id="po-n">' + esc(cur.title) + '</b><span class="meta">Rad je započet, nije predan · Rok: ' + esc(cur.due) + '</span><button class="btn" type="button" data-act="otvori" data-id="' + cur.id + '">Otvori rad</button></section>';
      var byRok = s.pollOrder !== 'kolegij', soon = addDays(App.data.todayIso, 14), list = '';
      if (byRok) {
        [['po-s1', 'Uskoro', function (t) { return !s.submitted[t.id] && t.iso <= soon; }],
         ['po-s2', 'Kasnije', function (t) { return !s.submitted[t.id] && t.iso > soon; }],
         ['po-s3', 'Predano', function (t) { return !!s.submitted[t.id]; }]].forEach(function (g) {
          var part = tasks.filter(g[2]).sort(byDue);
          if (part.length) list += '<h3 id="' + g[0] + '">' + g[1] + '</h3><ul class="list" aria-labelledby="' + g[0] + '">' + part.map(function (t) { return task(t, s, true); }).join('') + '</ul>';
        });
      } else list = '<ul class="list">' + tasks.map(function (t) { return task(t, s, true); }).join('') + '</ul>';
      var open = tasks.filter(function (t) { return !s.submitted[t.id]; }).length;
      body += '<section class="po-sec" aria-labelledby="po-h"><div class="po-tools"><h2 id="po-h">Moji zadaci</h2>' +
        '<label>Poredak <select class="input" data-sel="order" aria-label="Poredak zadataka"><option value="rok"' + (byRok ? ' selected' : '') + '>Po roku</option><option value="kolegij"' + (byRok ? '' : ' selected') + '>Po kolegiju</option></select></label></div>' + list +
        '<div class="po-ics"><button class="btn secondary" type="button" data-act="ics"' + (open ? '' : ' aria-disabled="true"') + ' aria-describedby="po-ics-n">Dodaj rokove u kalendar</button>' +
        '<span class="meta" id="po-ics-n">' + (open ? 'Datoteka (.ics) nastaje u Vašem pregledniku i ne šalje se poslužitelju. Sadrži samo naslov zadatka, kolegij i rok. Ako se rok promijeni, kalendar se ne ažurira sam.' : 'Nema rokova za izvoz: svi zadaci su predani.') + '</span></div></section>' + codeCard();
    }
    return '<div class="po-wrap">' + hero + body + '</div>';
  }
  function codeCard() { return '<section class="card center po-card" aria-labelledby="po-k"><h3 id="po-k">Imate kod novog kolegija?</h3>' + codeForm() + '</section>'; }

  function kolegiji(ctx) {
    var s = ctx.state, v = ctx.variant;
    var head = '<div class="po-head"><h1>Moji kolegiji</h1><p class="lede">Kolegiji na koje ste upisani i njihovi zadaci.</p></div>';
    var body;
    if (v === 'ucitavanje') body = loading();
    else if (v === 'greska') body = error();
    else if (v === 'istekla') body = '<div class="card center po-card"><p class="note">Prijava nije valjana. Prijavite se ponovno.</p><button class="btn" type="button" data-act="aai">Prijava sustavom AAI@EduHr</button></div>';
    else if (v === 'prazno') body = '<div class="card center po-card"><p class="note">Zasad niste upisani ni u jedan kolegij.</p><button class="btn" type="button" data-act="upis">Upiši kolegij kodom</button></div>';
    else if (v === 'jedan') body = courseCard({ name: 'Kolegij C', tasks: App.data.tasks.filter(function (t) { return t.id === 't3'; }) }, s);
    else body = groups(s).map(function (c) { return courseCard(c, s); }).join('');
    return '<div class="po-wrap">' + head + body + '</div>';
  }

  function stateText(t, s) {
    var k = kind(t, s);
    if (k === 'predano') return 'Predano ' + s.submitted[t.id];
    if (k === 'obavijest') return 'Upute još nisu potvrđene';
    if (k === 'rad') return 'Rad je započet, nije predan';
    return 'Rad nije započet';
  }
  function radovi(ctx) {
    var s = ctx.state, v = ctx.variant;
    var head = '<div class="po-head"><h1>Moji radovi</h1><p class="lede">Vaši radovi na svim kolegijima i njihovo stanje.</p></div>';
    var body;
    if (v === 'ucitavanje') body = loading();
    else if (v === 'greska') body = error();
    else if (v === 'prazno') body = '<div class="card center po-card"><h2>Još nemate radova.</h2><p class="note">Radovi se ovdje prikazuju kad se upišete u kolegij sa zadatkom.</p><button class="btn" type="button" data-act="upis">Upiši kolegij kodom</button></div>';
    else {
      /* NF-1 P-5: filtar po stanju (uz pretragu i godinu iz weba, A-10). */
      var f = v === 'bezrezultata' ? 'predano-nema' : (s.workFilter || 'sve');
      var FL = [['sve', 'Sve'], ['zapredati', 'Za predati'], ['predano', 'Predano'], ['obavijest', 'Čeka potvrdu uputa']];
      var shown = App.visibleTasks().filter(function (t) { var k = kind(t, s); return f === 'sve' || (f === 'zapredati' && (k === 'rad' || k === 'zadatak')) || (f === 'predano' && k === 'predano') || (f === 'obavijest' && k === 'obavijest'); });
      var tools = '<div class="po-tools"><label>Stanje <select class="input" data-sel="filter" aria-label="Filtar po stanju rada">' + FL.map(function (o) { return '<option value="' + o[0] + '"' + ((f === o[0] || (f === 'predano-nema' && o[0] === 'predano')) ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></label>' +
        '<span class="meta" role="status">' + (f === 'predano-nema' ? 'Prikazano 0 od ' + App.visibleTasks().length : 'Prikazano ' + shown.length + ' od ' + App.visibleTasks().length) + '</span></div>';
      if (v === 'bezrezultata') body = tools + '<div class="card center po-card"><p class="note">Nema radova za odabrani filter.</p><button class="btn secondary" type="button" data-act="filtarSve">Prikaži sve radove</button></div>';
      else body = tools + '<ul class="list" aria-label="Popis radova">' + shown.map(function (t) {
        return '<li class="item po-task"><span><span class="eyebrow">' + esc(t.course) + '</span><span class="title">' + esc(t.title) + '</span><span class="po-when" id="pr-' + t.id + '"><span>' + esc(stateText(t, s)) + '</span>' +
          (s.submitted[t.id] ? (afterDue(t, s) ? '<span class="tag late">Predano nakon roka</span>' : '') : '<span>' + (t.ext ? 'Produljeni rok ' : 'Rok ') + esc(t.due) + '</span>' + dueTags(t, s)) + '</span>' + (s.submitted[t.id] ? '' : extNote(t)) + '</span>' + btn(t, s, true, 'pr-' + t.id) + '</li>';
      }).join('') + '</ul>';
    }
    return '<div class="po-wrap">' + head + body + '</div>';
  }

  var actions = {
    otvori: function (el, ctx) {
      var id = el.getAttribute('data-id'), s = App.state; s.current = id;
      App.go(s.submitted[id] ? 'potvrda' : !s.ack[id] ? 'obavijest' : 'rad');
    },
    kod: function (form) {
      var v = normCode(form.elements.kod.value);   // NF-1 P-11: isto pravilo kao na upisu
      App.state.pendingCode = v; App.go('upis');
    },
    filtarSve: function () { App.state.workFilter = 'sve'; App.state.variant.radovi = 'puno'; App.rerender(); },
    ics: function (el) {
      var list = App.visibleTasks().filter(function (t) { return !App.state.submitted[t.id]; });
      if (!list.length) { App.toast('Nema rokova za izvoz.'); return; }
      function e(x) { return String(x).replace(/[\\;,]/g, function (c) { return '\\' + c; }); }
      var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ductura//student//HR', 'CALSCALE:GREGORIAN'];
      list.forEach(function (t) { var d = t.iso.replace(/-/g, '') + 'T235900'; L.push('BEGIN:VEVENT', 'UID:' + t.id + '@ductura.invalid', 'DTSTAMP:20261105T080000Z', 'DTSTART:' + d, 'DTEND:' + d, 'SUMMARY:' + e('Rok: ' + t.title + ' (' + t.course + ')'), 'END:VEVENT'); });
      L.push('END:VCALENDAR');
      try {
        var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([L.join('\r\n') + '\r\n'], { type: 'text/calendar' })); a.download = 'ductura-rokovi.ics';
        document.body.appendChild(a); a.click(); a.remove();
        App.toast('Datoteka rokova je preuzeta (' + list.length + ').');
      } catch (err) { App.toast('Datoteku rokova nije moguće napraviti u ovom pregledniku.'); }
    },
    ponovno: function () { var n = location.hash.replace('#', ''); App.state.variant[n] = 'puno'; App.rerender(); },
    upis: function () { App.go('upis'); },
    aai: function () { App.state.loggedIn = false; App.state.variant.prijava = 'zadano'; App.go('prijava'); }
  };
  [['pocetna', 'S-02 Početna', pocetna], ['kolegiji', 'S-03 Moji kolegiji', kolegiji], ['radovi', 'Moji radovi', radovi]].forEach(function (r) {
    App.register(r[0], { title: r[1], shell: 'side', variants: variants(r[0]), render: r[2], actions: actions, after: function (stage) {
      Array.prototype.forEach.call(stage.querySelectorAll('[data-sel]'), function (sel) {
        sel.addEventListener('change', function () {
          if (sel.getAttribute('data-sel') === 'order') App.state.pollOrder = sel.value; else { App.state.workFilter = sel.value; App.state.variant.radovi = 'puno'; }
          App.rerender(); var again = document.querySelector('[data-sel="' + sel.getAttribute('data-sel') + '"]'); if (again) again.focus();
        });
      });
    } });
  });
})();

<script>
(function () {
  var val = '', timer = null;
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function norm(s) { return String(s || '').replace(/[\s\-]/g, '').toUpperCase(); }

  /* ---------- S-04 ---------- */
  var MSG = {
    neispravan: 'Kod ima od 8 do 32 slova i brojke. Provjerite ga i upišite ponovno.',
    istekao: 'Kod ne postoji ili je istekao. Provjerite ga s nastavnikom.',
    mreza: 'Nema veze s poslužiteljem. Provjerite mrežu i pokušajte ponovno.',
    previse: 'Previše pokušaja. Pričekajte malo i pokušajte ponovno ili se javite nastavniku.'
  };
  var SAMPLE = { upisivanje: 'KOL-D-2026', neispravan: 'K7', istekao: 'KOLA-0000-ZZ', mreza: 'KOL-D-2026', previse: 'KOLA-0000-ZZ' };
  window.addEventListener('hashchange', function () { if (location.hash !== '#upis') App.state.attempts = 0; });

  function field(v, busy, errKey) {
    var e = errKey ? MSG[errKey] : '';
    return '<form class="up-center" style="display:grid;gap:12px;justify-items:center;width:100%" data-submit="upisi" novalidate>' +
      '<div class="field"><label for="up-kod">Kod kolegija</label>' +
      '<span class="up-row"><input class="input code" id="up-kod" name="kod" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" placeholder="KOD-KOLEGIJA" value="' + esc(v) + '"' +
      (busy ? ' readonly' : '') + (errKey && errKey !== 'mreza' && errKey !== 'previse' ? ' aria-invalid="true"' : '') +
      ' aria-describedby="up-uputa' + (e ? ' up-greska' : '') + '">' +
      '<button class="btn" type="submit"' + (busy ? ' aria-disabled="true"' : '') + '>' + (busy ? 'Upisivanje…' : 'Upiši') + '</button></span></div>' +
      (e ? '<span class="err" id="up-greska" role="alert">' + e + '</span>' : '') +
      '<span class="meta" id="up-uputa">Kod Vam daje nastavnik. Razmaci, crtice i velika ili mala slova nisu bitni.</span>' +
      '<span class="up-hint">Pomoć prototipa: probni kod je <span class="mono">' + esc(App.data.enrollCode) + '</span>.</span></form>';
  }

  function renderUpis(ctx) {
    var v = ctx.variant, s = ctx.state, html;
    if (v === 'puno' && s.pendingCode) { val = String(s.pendingCode); delete s.pendingCode; }
    if (v === 'puno') return '<section class="card up-center" aria-labelledby="up-h"><h1 id="up-h">Upiši kolegij</h1>' + field(val, false, '') + '</section>';
    if (v === 'upisivanje') return '<section class="card up-center" aria-busy="true" aria-labelledby="up-h"><h1 id="up-h">Upiši kolegij</h1>' + field(val || SAMPLE.upisivanje, true, '') + '<span class="meta" role="status">Upisivanje u kolegij…</span></section>';
    if (v === 'neispravan' || v === 'istekao' || v === 'mreza' || v === 'previse')
      return '<section class="card up-center" aria-labelledby="up-h"><h1 id="up-h">Upiši kolegij</h1>' + field(val || SAMPLE[v], false, v) + '</section>';
    if (v === 'vecupisan')

  var PREV_DUE = { t1: '1. 11. 2026., 23:59', t2: '8. 1. 2027., 23:59', t3: '25. 9. 2026., 23:59', t4: '13. 12. 2026., 23:59', t5: '23. 10. 2026., 23:59' };

  function notice(t) {

      close: function () {
        var dl = S().dialog; S().dialog = null; App.rerender();
        var f = dl && dl.kind === 'chat' ? document.querySelector('[data-act="chat"][data-n="' + dl.n + '"]') : null;
        if (f) f.focus();
      }
    },
    after: function (stage, ctx) {
      var id = ctx.task.id, box = stage.querySelector('#sb-confirm');
      if (box) box.addEventListener('change', function () {
        S().check[id] = box.checked;
        if (box.checked) S().declared[id] = App.data.today + ' u 21:10'; else delete S().declared[id];
        App.rerender();
        var b = document.getElementById('sb-confirm'); if (b) b.focus();
      });
      var ans = stage.querySelector('#sb-ans');
      if (ans) ans.addEventListener('input', function () { S().form[id] = ans.value; });
      trapDialog(stage);
    }
  });

  App.register('predaja', {
    title: 'S-31 Predaja',
    shell: 'none',
    variants: [
      { id: 'puno', label: 'puno (stanje toka)' },
      { id: 'nakonroka', label: 'nakon roka' }, { id: 'produljen', label: 'produljen rok' }, { id: 'bezmreze', label: 'bez mreže' },
      { id: 'utijeku', label: 'predaja u tijeku' }, { id: 'odbijeno', label: 'greška predaje: zapis nije potvrđen' },
      { id: 'nedovrseno', label: 'predaja nije dovršena' }, { id: 'nepoznato', label: 'ishod nepoznat' },
      { id: 'ucitavanje', label: 'učitavanje' }, { id: 'greska', label: 'greška učitavanja' }
    ],
    render: function (ctx) {
      var t = ctx.task, v = ctx.variant, st = ctx.state;
      if (v === 'ucitavanje') return page(t, 'Predaja', panel('sb-h', 'Predaja', '', loadingBody('Učitavam stanje rada s poslužitelja.'), ' sb-busy'));
      if (v === 'greska') return page(t, 'Predaja', panel('sb-h', 'Predaja', '',
        '<p class="note" role="alert">Stanje rada trenutačno nije moguće učitati, pa se ne vidi je li rad predan. Tekst rada nije zahvaćen. Prije nove predaje pokušajte ponovno: ako je predaja zabilježena, ovdje će stajati potvrda.</p>' +
        '<div class="sb-acts"><button class="btn secondary" type="button" data-act="retry">Pokušaj ponovno</button></div>'));
      if (v === 'odbijeno') return page(t, 'Predaja', panel('sb-h', 'Predaja', '',
        '<p class="note" role="alert">Poslužitelj još nije potvrdio cijeli zapis ove verzije teksta. Ostavite radni prostor otvoren s vezom; predaju možete pokušati čim se stanje u radnom prostoru promijeni u „spremljeno na poslužitelju”.</p>' +
        '<p class="note">Rad nije predan. Tekst je spremljen na uređaju.</p><a href="#rad" data-go="rad">Otvori radni prostor</a>'));
      if (v === 'nedovrseno') return page(t, 'Predaja', panel('sb-h', 'Predaja nije dovršena: zamjenski postupak', '',
        '<p class="note" role="alert">Predaja nije dovršena: tekst sastavljen iz zapisa ne podudara se s tekstom na poslužitelju. Vrijeme Vašeg zahtjeva (' + fmt(parse(SERVER_NOW())) + ') je zabilježeno i ostaje vrijeme predaje. Fakultet će nastaviti predaju zamjenskim postupkom: Obratite se nastavniku kolegija.</p>'));
      if (v === 'nepoznato') return page(t, 'Predaja', panel('sb-h', 'Predaja', '',
        '<p class="note">Predaja ovog rada već je zatražena ' + fmt(parse(SERVER_NOW())) + '.</p>' +
        '<p class="note" role="alert">Potvrda nije stigla, pa ishod predaje nije poznat. Prije ponovnog pokušaja otvorite ovu stranicu ponovno: ako je predaja zabilježena, ovdje će stajati potvrda.</p>' +
        '<div class="sb-acts"><button class="btn secondary" type="button" data-act="check">Provjeri stanje predaje</button></div>'));
      if (v === 'puno' && st.submitted[t.id]) return page(t, 'Predaja', panel('sb-h', 'Predaja', esc(t.kind),
        '<p class="note">Predaja ovog rada već je zatražena ' + fmt(parse(st.submitted[t.id])) + '. Izjava je predana s radom i više se ne mijenja.</p><a href="#potvrda" data-go="potvrda">Otvori potvrdu o predaji</a>'));
      if (v === 'puno' && !st.started[t.id]) return page(t, 'Predaja', panel('sb-h', 'Predaja', '',
        '<p class="note">Rad još nije započet. Započnite ga u radnom prostoru.</p><a href="#rad" data-go="rad">Otvori radni prostor</a>'));
      var body = '<div>' + steps(4) + '</div>' + submitPanel(t, v, st);
      return page(t, 'Predaja', body) + dialog(t);
    },
    actions: {
      retry: function () { App.state.variant.predaja = 'puno'; App.rerender(); },
      check: function () { App.toast('Stanje predaje provjerava se na poslužitelju.'); },
      ask: function () { S().dialog = { kind: 'submit' }; App.rerender(); },
      noop: function () {},
      close: function () {
        if (S().sending) return;
        S().dialog = null; App.rerender();
        var f = document.querySelector('[data-act="ask"]'); if (f) f.focus();
      },
      submit: function (el, ctx) {
        if (S().sending) return;
        var id = ctx.task.id; S().sending = true; App.rerender();
        setTimeout(function () {
          S().sending = false; S().dialog = null;
          App.state.submitted[id] = SERVER_NOW();
          App.state.variant.potvrda = 'puno';
          App.go('potvrda');
        }, 900);
      }
    },
    after: function (stage) { trapDialog(stage); }
  });

  /* ---------- S-32 Potvrda predaje ---------- */
  function qr(seed) {
    var n = 21, hx = hex(seed + 'qr'), cells = '', bit = 0;
    function finder(x, y) { return '<path d="M' + x + ' ' + y + 'h7v7h-7z M' + (x + 1) + ' ' + (y + 1) + 'v5h5v-5z" fill-rule="evenodd"/><rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3"/>'; }
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
      if ((x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12)) continue;
      var v = parseInt(hx[bit % 64], 16) >> (bit % 4) & 1; bit += 3;
      if ((v ^ ((x * y + x) % 3 === 0 ? 1 : 0))) cells += 'M' + x + ' ' + y + 'h1v1h-1z';
    }
    return '<svg viewBox="0 0 21 21" aria-hidden="true" focusable="false" fill="currentColor" shape-rendering="crispEdges">' +
      finder(0, 0) + finder(14, 0) + finder(0, 14) + '<path d="' + cells + '"/></svg>';
  }
  App.register('potvrda', {
    title: 'S-32 Potvrda predaje',
    shell: 'none',
    variants: [
      { id: 'puno', label: 'puno (stanje toka)' }, { id: 'ceka', label: 'potvrda čeka potpis' }, { id: 'nakonroka', label: 'nakon roka' },
      { id: 'praznine', label: 'zapis ima praznine' }, { id: 'prazno', label: 'prazno (rad nije predan)' },
      { id: 'ucitavanje', label: 'učitavanje' }, { id: 'greska', label: 'greška' }
    ],
    render: function (ctx) {
      var t = ctx.task, v = ctx.variant, st = ctx.state, kind = esc(t.kind);
      if (v === 'ucitavanje') return page(t, 'Potvrda', panel('sb-h', 'Potvrda predaje', '', loadingBody('Učitavam potvrdu s poslužitelja.'), ' sb-busy'));
      if (v === 'greska') return page(t, 'Potvrda', panel('sb-h', 'Potvrda predaje', '',
        '<p class="note" role="alert">Potvrdu trenutačno nije moguće učitati. Ako je rad predan, predaja i vrijeme predaje time se ne mijenjaju.</p><div class="sb-acts"><button class="btn secondary" type="button" data-act="retry">Pokušaj ponovno</button></div>'));
      if (v === 'prazno' || (v === 'puno' && !st.submitted[t.id])) return page(t, 'Potvrda', panel('sb-h', 'Potvrda predaje', '',
        '<p class="note">Ovaj rad još nije predan, pa potvrde nema.</p><a href="#rad" data-go="rad">Otvori radni prostor</a>'));
      var sp = parse(st.submitted[t.id] || FALLBACK_SUB), d = dueP(t);
      if (v === 'nakonroka' && !isLate(t, sp)) sp = addMin(d, 13);
      var late = isLate(t, sp), signed = addMin(sp, v === 'nakonroka' ? 1 : 0);
      var foot = '<div class="sb-acts"><button class="btn secondary" type="button" data-go="pocetna">Na početnu</button></div>';
      if (v === 'ceka') {
        return page(t, 'Potvrda', steps(5) + panel('sb-h', 'Predaja u obradi', kind,
          '<p class="note" role="status">Predaja je zabilježena ' + fmt(sp) + '. Potpis potvrde još se izdaje; vrijeme predaje se time ne mijenja.</p>' +
          '<div class="sb-kv"><span>Vrijeme predaje</span><b>' + zoned(sp) + '</b></div><div class="sb-kv"><span>Rok</span><b>' + zoned(d) + '</b></div>' +
          '<div class="sb-kv"><span>Potpisivanje potvrde započelo</span><b>još nije zabilježeno</b></div>' +
          '<a href="#rad" data-go="rad">Otvori radni prostor</a>' + foot));
      }
      var gaps = v === 'praznine' || v === 'puno';
      var hx = hex(t.id + fmt(sp)), grouped = hx.match(/.{4}/g).join(' ');
      var b = '<div class="sb-kv"><span>Vrijeme predaje</span><b>' + zoned(sp) + '</b></div>' +
        '<div class="sb-kv"><span>Rok</span><b>' + zoned(d) + '</b></div>' +
        '<div class="sb-kv"><span>Potpisivanje potvrde započelo</span><b>' + zoned(signed) + '</b></div>' +
        '<details><summary>Točne vrijednosti iz potvrde (UTC)</summary><p class="sb-mono">requestedAt ' + iso(sp, 7, '482193') + '<br>dueAt ' + iso(d, 59, '000000') + '<br>signedAt ' + iso(signed, 9, '106457') + '</p></details>' +
        '<h3 class="sb-sub">Otisak predanog teksta</h3><p class="sb-mono">' + grouped + '</p>' +
        '<p class="meta">Niz znakova izračunan iz točnog predanog teksta. Ako se tekst promijeni i za jedan znak, otisak više nije isti.</p>' +
        '<div class="sb-acts"><button class="btn secondary" type="button" data-act="copy" data-hash="' + hx + '">Kopiraj otisak</button></div>' +
        (gaps ? '<p class="note">Zapis ima praznine.</p>' : '') +
        '<a href="#potvrda" data-act="sum" aria-expanded="' + (S().showSum ? 'true' : 'false') + '" aria-controls="sb-sum-h">Otvori sažetak procesa</a>' +
        '<p class="note">Potpis potvrde provjerava se na stranici Provjera potvrde, bez prijave.</p>' +
        '<a href="#potvrda" data-act="verify">Provjera potvrde</a>' +
        '<div class="sb-qr">' + qr(t.id) + '<p class="meta">QR kod je u preuzetom zapisu. Ovdje je samo uzorak bez sadržaja.</p></div>' +
        '<a href="#potvrda" data-act="pdf">Preuzmi zapis (PDF s QR kodom)</a>' + foot;
      var title = 'Predano ' + fmt(sp) + (late ? ', nakon roka' : '');
      var out = steps(5) + panel('sb-h', title, kind, b);
      if (S().showSum) out += summaryPanel(t, { submitted: st.submitted[t.id] || FALLBACK_SUB, gaps: gaps }, 'h2');
      return page(t, 'Potvrda', out);
    },
    actions: {
      retry: function () { App.state.variant.potvrda = 'puno'; App.rerender(); },
      copy: function (el) {
        var h = el.getAttribute('data-hash');
        try { if (navigator.clipboard) navigator.clipboard.writeText(h).catch(function () {}); } catch (e) {}
        App.toast('Otisak je u međuspremniku (64 znaka, bez razmaka).');
      },
      verify: function () { App.toast('Provjera potvrde otvara se na stranici /provjera. U prototipu nije izvedena.'); },
      pdf: function () { App.toast('Preuzimanje zapisa (PDF s QR kodom) u prototipu nije izvedeno.'); },
      sum: function () {
        S().showSum = !S().showSum; App.rerender();
        if (S().showSum) { var h = document.getElementById('sb-sum-h'); if (h) h.scrollIntoView({ block: 'start' }); }
      }
    }
  });
})();
</script>


<!-- postavke: obavijesti izvan zvonca (NF-1 P-17) -->
<style>
.ps-sec h2 { font-size:20px; }
.ps-sec h3 { font:600 13.5px/1.4 var(--ff-ui); letter-spacing:0; }
.ps-check { display:flex; gap:10px; align-items:flex-start; min-height:44px; text-align:left; }
.ps-check input { margin-top:2px; }
.ps-cols { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.ps-cols > div { display:grid; gap:6px; align-content:start; min-width:0; }
.ps-mail { background:var(--sheet); border:1px solid var(--rule); border-radius:6px; padding:12px 14px; display:grid; gap:4px; }
.ps-mail b { font-weight:600; }
.nf-solo { min-height:100%; display:grid; place-items:center; padding:24px 16px; }
.nf-solo .pj-card { width:100%; max-width:460px; }
@media (max-width:640px) { .ps-cols { grid-template-columns:1fr; } }
</style>
<script>
(function () {
  var ADDR = 'student.a@example.test';
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var KINDS = [['version', 'Novi zadatak i nova verzija zadatka'], ['reminder', 'Podsjetnik prije roka'], ['comment', 'Novi komentar uz rad'], ['submission', 'Potvrda predaje']];
  function loading() { return '<div class="card" aria-busy="true"><span class="meta" role="status">Učitavanje postavki…</span><div class="skel w60"></div><div class="skel w80"></div><div class="skel w40"></div></div>'; }
  function check(id, label, on, dis, desc) { return '<label class="ps-check"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + (dis ? ' disabled' : '') + (desc ? ' aria-describedby="' + desc + '"' : '') + '>' + label + '</label>'; }
  function preview() {
    return '<div class="ps-mail" role="group" aria-label="Primjer poruke"><span class="meta">Primjer poruke (izmišljeni podaci)</span><b>Predmet: Ductura: nova verzija zadatka na kolegiju Kolegij B</b>' +
      '<span>Kolegij B · Javna rasprava o školskom kurikulu</span><span>Rok: 15. 1. 2027., 23:59</span><span>Otvorite Ducturu za upute.</span>' +
      '<span class="meta">Obavijesti e-poštom možete isključiti poveznicom „Odjava iz obavijesti” na dnu poruke.</span></div>';
  }
  function render(ctx) {
    var v = ctx.variant, p = ctx.state.notifPrefs;
    var head = '<div class="po-head"><h1>Postavke obavijesti</h1><p class="lede">Odaberite gdje želite primati obavijesti o zadacima. Obavijesti u aplikaciji, u zvoncu, uvijek su uključene.</p></div>';
    if (v === 'ucitavanje') return '<div class="po-wrap">' + head + loading() + '</div>';
    if (v === 'greska') return '<div class="po-wrap">' + head + '<div class="card po-card" role="alert"><h2>Postavke trenutačno nisu dostupne.</h2><p class="note">Podatke nije bilo moguće učitati. Vaše postojeće postavke nisu promijenjene.</p><button class="btn" type="button" data-act="ponovno" style="justify-self:start">Pokušaj ponovno</button></div></div>';
    var busy = v === 'spremanje', noAddr = v === 'bezadrese', blocked = v === 'pushblokiran';
    var stat = busy ? '<span class="meta" role="status">Spremanje postavki…</span>' :
      v === 'greskaspremanja' ? '<span class="err" role="alert">Postavke nisu spremljene. Pokušajte ponovno. Dok se ne spreme, vrijede prethodne.</span>' :
      v === 'spremljeno' ? '<span class="ok" role="status">Postavke su spremljene.' + (p.email ? ' E-pošta je uključena.' : '') + '</span>' : '';
    return '<div class="po-wrap" id="ps-root"' + (busy ? ' aria-busy="true"' : '') + '>' + head +
      '<section class="card ps-sec" aria-labelledby="ps-e"><h2 id="ps-e">E-pošta</h2>' +
        (noAddr ? '<p class="note" role="status">Račun AAI@EduHr ne daje e-adresu pa se obavijesti e-poštom ne mogu uključiti. Obavijesti u aplikaciji ostaju uključene.</p>' :
          '<p class="note">Poruke se šalju na adresu iz Vašeg računa AAI@EduHr: <span class="mono">' + ADDR + '</span>. Adresu ne možete promijeniti ovdje.</p>') +
        check('ps-email', 'Pristajem da mi Ductura šalje obavijesti na tu e-adresu.', p.email && !noAddr, noAddr || busy, 'ps-email-n') +
        '<span class="meta" id="ps-email-n">Pristanak je dobrovoljan i možete ga povući u svakom trenutku: ovdje ili poveznicom „Odjava iz obavijesti” u svakoj poruci.</span></section>' +
      '<section class="card ps-sec" aria-labelledby="ps-p"><h2 id="ps-p">U pregledniku (push)</h2>' +
        (blocked ? '<p class="err" role="alert">Preglednik ne dopušta obavijesti za ovu stranicu. Dopuštenje promijenite u postavkama preglednika, pa ponovno uključite.</p>' : '<p class="note">Obavijest se prikazuje i kad Ductura nije otvorena. Vrijedi samo za ovaj preglednik; preglednik će zatražiti dopuštenje.</p>') +
        check('ps-push', 'Prikaži obavijesti u ovom pregledniku.', p.push && !blocked, blocked || busy, '') + '</section>' +
      '<section class="card ps-sec" aria-labelledby="ps-k"><h2 id="ps-k">Koje obavijesti</h2><p class="meta">Odabir vrijedi za e-poštu i preglednik.</p>' +
        KINDS.map(function (k) { return check('ps-k-' + k[0], k[1], p.kinds[k[0]], busy, ''); }).join('') + '</section>' +
      '<section class="card ps-sec" aria-labelledby="ps-s"><h2 id="ps-s">Što poruka sadrži</h2><div class="ps-cols"><div><h3>Sadrži</h3><ul class="facts"><li>Naslov zadatka i naziv kolegija.</li><li>Rok.</li><li>Poveznicu na Ducturu.</li></ul></div>' +
        '<div><h3>Ne sadrži</h3><ul class="facts"><li>Nijedan dio Vašeg rada ni podatke o tome što ste pisali i kada.</li><li>Tekst komentara nastavnika.</li><li>Ocjene.</li></ul></div></div>' + preview() + '</section>' +
      '<div class="up-act">' + stat + '<button class="btn" type="button" data-act="spremi"' + (busy ? ' aria-disabled="true"' : '') + '>' + (busy ? 'Spremanje…' : 'Spremi postavke') + '</button><a class="up-link" href="#pocetna" data-go="pocetna">Natrag na Moje zadatke</a></div></div>';
  }
  var timer = null;
  App.register('postavke', {
    title: 'S-06 Postavke obavijesti', shell: 'side', narrow: true,
    variants: [{ id: 'puno', label: 'zadano (e-pošta i push isključeni)' }, { id: 'ucitavanje', label: 'učitavanje' }, { id: 'greska', label: 'greška pri učitavanju' }, { id: 'spremanje', label: 'spremanje' }, { id: 'spremljeno', label: 'spremljeno' }, { id: 'greskaspremanja', label: 'greška pri spremanju' }, { id: 'bezadrese', label: 'račun bez e-adrese' }, { id: 'pushblokiran', label: 'preglednik blokira obavijesti' }],
    render: render,
    actions: {
      ponovno: function () { App.state.variant.postavke = 'puno'; App.rerender(); },
      spremi: function (el, ctx) {
        if (ctx.variant === 'spremanje') return;
        var p = App.state.notifPrefs;
        p.email = !!(document.getElementById('ps-email') && document.getElementById('ps-email').checked);
        p.push = !!(document.getElementById('ps-push') && document.getElementById('ps-push').checked);
        KINDS.forEach(function (k) { var c = document.getElementById('ps-k-' + k[0]); if (c) p.kinds[k[0]] = c.checked; });
        App.state.variant.postavke = 'spremanje'; App.rerender();
        clearTimeout(timer);
        timer = setTimeout(function () { if (location.hash !== '#postavke') return; App.state.variant.postavke = 'spremljeno'; App.rerender(); App.toast('Postavke su spremljene.'); }, 700);
      }
    },
    after: function (stage) {
      var c = stage.querySelector('#ps-email'), p = stage.querySelector('#ps-push');
      if (c) c.addEventListener('change', function () { App.state.notifPrefs.email = c.checked; });
      if (p) p.addEventListener('change', function () { App.state.notifPrefs.push = p.checked; });
    }
  });

  /* Javna poveznica „Odjava iz obavijesti” iz poruke e-pošte: bez ljuske, bez prijave (token u poveznici). */
  function solo(inner) { return '<div class="nf-solo">' + inner + '</div>'; }
  App.register('odjavaposte', {
    title: 'S-07 Odjava iz obavijesti e-poštom (poveznica iz poruke)', shell: 'none',
    variants: [{ id: 'puno', label: 'zadano' }, { id: 'odjavljivanje', label: 'odjavljivanje' }, { id: 'uspjeh', label: 'odjavljeno' }, { id: 'istekla', label: 'poveznica ne vrijedi' }, { id: 'greska', label: 'greška, poslužitelj ne odgovara' }],
    render: function (ctx) {
      var v = ctx.variant;
      if (v === 'odjavljivanje') return solo('<section class="pj-card" role="status" aria-busy="true"><h2>Odjavljujemo Vas</h2><div class="pj-bar" aria-hidden="true"><span></span></div><button class="btn" type="button" disabled>Odjava iz obavijesti</button></section>');
      if (v === 'uspjeh') return solo('<section class="pj-card" role="status"><h2>Odjavljeni ste</h2><p class="note">Obavijesti e-poštom više se ne šalju na tu adresu. Obavijesti u aplikaciji ostaju uključene.</p><p class="meta">Možete ih ponovno uključiti u postavkama obavijesti nakon prijave.</p><a href="#prijava" data-go="prijava">Prijava sustavom AAI@EduHr</a></section>');
      if (v === 'istekla') return solo('<section class="pj-card" role="alert"><h2>Poveznica ne vrijedi</h2><p class="note">Poveznica je istekla ili je već iskorištena. Prijavite se i isključite obavijesti e-poštom u postavkama obavijesti.</p><a href="#prijava" data-go="prijava">Prijava sustavom AAI@EduHr</a></section>');
      if (v === 'greska') return solo('<section class="pj-card" role="alert"><h2>Odjava nije dovršena</h2><p class="note">Poslužitelj trenutačno ne odgovara. Vaše postavke nisu promijenjene. Pokušajte ponovno za nekoliko minuta.</p><button class="btn" type="button" data-act="odjava">Pokušaj ponovno</button></section>');
      return solo('<section class="pj-card" aria-labelledby="oj-h"><h2 id="oj-h">Odjava iz obavijesti e-poštom</h2><p class="note">Ductura više neće slati obavijesti o zadacima na Vašu e-adresu. Obavijesti u aplikaciji ostaju uključene.</p><button class="btn" type="button" data-act="odjava">Odjava iz obavijesti</button></section>');
    },
    actions: {
      odjava: function () {
        App.state.variant.odjavaposte = 'odjavljivanje'; App.rerender();
        setTimeout(function () { if (location.hash !== '#odjavaposte') return; App.state.notifPrefs.email = false; App.state.variant.odjavaposte = 'uspjeh'; App.rerender(); }, 700);
      }
    }
  });
})();
