<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ductura nastavnik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>/* Ductura nastavnički prototip: tokeni "papir i grafit" (D-188), isti kao studentski prototip. */
:root {
  --ground:#242422; --sheet:#2e2e2b; --chrome:#292a28; --ink:#faf9f5; --ink-2:#dedbd3; --ink-3:#c9c5bb;
  --rule:#8c887f; --rule-2:#5a5853; --hover:#3a3a36; --raised:#2e2e2b; --raised-rule:#b3aea3; --card:#33332f;
  --selected:#3a3a36; --well:#3a3a36; --ink-muted:#8c887f; --warn:#e9c58b; --warn-soft:#3a2f22;
  --accent:#c8aa6e; --accent-hover:#dcc28a; --accent-ink:#242422; --accent-soft:#3a3a36; --link-rule:#b3aea3;
  --field:#2a2a27; --field-rule:#a6a196; --field-placeholder:#bcb7ac;
  --synced:#a2c6e5; --synced-soft:#24303a;
  --cmt:#e9c58b; --cmt-ink:#e9c58b; --cmt-bg:#e9c58b26;
  --proto-bg:#1b1b1a; --proto-ink:#c9c5bb; --proto-rule:#5a5853; --proto-field:#2a2a27; --proto-field-ink:#faf9f5; --proto-accent:#c8aa6e;
  --scrim:#0008; --lift:0 1px 1px #0007, 0 12px 34px -10px #000a;
  --ff-ui:"Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  --ff-display:"Newsreader", Georgia, serif;
  --ff-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px)); --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground:#f3f2ee; --chrome:#faf9f6; --raised:#faf9f6; --hover:#ecebe5; --selected:#ecebe5; --rule:#cfccc4; --rule-2:#e2e0d9;
    --well:#ecebe5; --ink:#242422; --ink-2:#55534d; --ink-3:#5c5a54; --accent:#806529; --accent-ink:#fcfbf8; --accent-soft:#efe9dc;
    --warn:#7a5420; --synced:#355b81; --sheet:#fcfbf8; --ink-muted:#5c5a54; --accent-hover:#6b5420;
    --warn-soft:#f3e6cf; --synced-soft:#e3edf6; --cmt:#7a5420; --cmt-ink:#7a5420; --cmt-bg:#e9c58b40;
    --card:#fcfbf8; --raised-rule:#85827a; --link-rule:#8a7550; --field:#fcfbf8; --field-rule:#85827a; --field-placeholder:#5c5a54;
    --lift:0 1px 1px #0001, 0 12px 34px -10px #0002; color-scheme:light;
  }
}
:root[data-theme="light"] {
  --ground:#f3f2ee; --chrome:#faf9f6; --raised:#faf9f6; --hover:#ecebe5; --selected:#ecebe5; --rule:#cfccc4; --rule-2:#e2e0d9;
  --well:#ecebe5; --ink:#242422; --ink-2:#55534d; --ink-3:#5c5a54; --accent:#806529; --accent-ink:#fcfbf8; --accent-soft:#efe9dc;
  --warn:#7a5420; --synced:#355b81; --sheet:#fcfbf8; --ink-muted:#5c5a54; --accent-hover:#6b5420;
  --warn-soft:#f3e6cf; --synced-soft:#e3edf6; --cmt:#7a5420; --cmt-ink:#7a5420; --cmt-bg:#e9c58b40;
  --card:#fcfbf8; --raised-rule:#85827a; --link-rule:#8a7550; --field:#fcfbf8; --field-rule:#85827a; --field-placeholder:#5c5a54;
  --lift:0 1px 1px #0001, 0 12px 34px -10px #0002; color-scheme:light;
}
/* List rada je uvijek gotovo bijeli papir. */
.sheet { --sheet:#fcfbf8; --ink:#242422; --ink-2:#55534d; --ink-3:#5c5a54; --rule:#cfccc4; --rule-2:#f1efea; --accent:#806529; --accent-ink:#fcfbf8;
  --well:#efede7; --card:#fcfbf8; --cmt:#b8862a; --cmt-ink:#8a6420; --cmt-bg:#b8862a26; --link-rule:#8a7550; color-scheme:light;
  background:var(--sheet); color:var(--ink); }

*,*::before,*::after { box-sizing:border-box; }
html { height:100vh; height:100dvh; }
body { margin:0; height:100vh; height:100dvh; background:var(--ground); color:var(--ink); font:13.5px/1.5 var(--ff-ui); display:grid; grid-template-rows:auto minmax(0,1fr); -webkit-text-size-adjust:none; }
h1,h2,h3,h4 { font-family:var(--ff-display); font-weight:500; letter-spacing:-0.015em; margin:0; line-height:1.15; }
p { margin:0; } ul,ol { margin:0; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--accent); text-decoration:underline; text-decoration-color:var(--link-rule); text-underline-offset:3px; }
:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
[hidden] { display:none !important; }
input[type="checkbox"], input[type="radio"] { accent-color:var(--accent); width:18px; height:18px; margin:0; flex:none; }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }

/* Traka prototipa i bilješka prototipa: nisu dio sučelja proizvoda. */
#proto-bar { display:flex; gap:6px 10px; flex-wrap:wrap; align-items:center; padding:6px var(--gutter-r) 6px var(--gutter-l); background:var(--proto-bg); color:var(--proto-ink); border-bottom:1px dashed var(--proto-rule); font:11.5px/1.3 var(--ff-mono); }
#proto-bar b { color:var(--proto-accent); font-weight:500; text-transform:uppercase; letter-spacing:.06em; }
#proto-bar label { display:inline-flex; gap:5px; align-items:center; min-width:0; }
#proto-bar select, #proto-bar button { font:11.5px var(--ff-mono); background:var(--proto-field); color:var(--proto-field-ink); border:1px solid var(--proto-rule); border-radius:4px; min-height:30px; padding:0 6px; max-width:46vw; }
#stage { min-height:0; overflow:auto; position:relative; display:flex; flex-direction:column; }
#stage > .shell, #stage > .sb-wrap { flex:1 0 auto; }
.proto-note { font:11.5px/1.45 var(--ff-mono); color:var(--ink-2); border:1px dashed var(--rule); border-radius:4px; padding:4px 8px; margin:8px var(--gutter-r) 0 var(--gutter-l); overflow-wrap:anywhere; }
.proto-note b { font-weight:500; color:var(--ink); }

/* Zajednički dijelovi */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; font:600 13.5px/1.1 var(--ff-ui); min-height:44px; padding:0 14px; border-radius:5px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); text-decoration:none; text-align:center; }
.btn:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
.btn.secondary { background:transparent; color:var(--ink); border-color:var(--rule); }
.btn.secondary:hover { background:var(--hover); border-color:var(--rule); }
.btn.ghost { background:transparent; color:var(--ink); border-color:transparent; text-decoration:underline; text-decoration-color:var(--link-rule); text-underline-offset:3px; }
.btn.small { padding:0 10px; }
.btn[aria-disabled="true"], .btn:disabled { background:var(--well); color:var(--ink-3); border-color:var(--rule-2); cursor:not-allowed; }
.btn[aria-pressed="true"] { background:var(--well); border-color:var(--ink-2); }
.input { min-height:44px; padding:6px 10px; border:1px solid var(--field-rule); border-radius:5px; background:var(--field); color:var(--ink); min-width:0; }
.input::placeholder { color:var(--field-placeholder); }
.input[aria-invalid="true"] { border-color:var(--warn); border-width:2px; }
textarea.input { min-height:88px; resize:vertical; }
.field { display:grid; gap:4px; min-width:0; } .field label, .field .lbl { font-size:12.5px; color:var(--ink-3); }
.err { color:var(--ink); font-size:12.5px; font-weight:600; border-left:3px solid var(--warn); padding-left:8px; }
.eyebrow, .meta { color:var(--ink-3); font-size:12.5px; }
.note, .lede { color:var(--ink-2); }
.mono { font-family:var(--ff-mono); }
.tag { display:inline-block; font-size:12.5px; font-weight:600; color:var(--ink-2); border:1px solid var(--rule); border-radius:4px; padding:1px 6px; white-space:nowrap; }
.tag.open { border-style:dashed; }
.card { background:var(--card); border:1px solid var(--rule-2); border-radius:10px; padding:24px; display:grid; gap:12px; min-width:0; }
.card.center { text-align:center; justify-items:center; }
.list { display:grid; gap:8px; margin:0; padding:0; list-style:none; }
.item { background:var(--card); border:1px solid var(--rule-2); border-radius:6px; padding:10px 12px; display:grid; gap:6px; min-width:0; }
.item .title { font-weight:600; }
.item a.rowlink { display:flex; align-items:center; min-height:44px; text-decoration:none; color:var(--ink); }
.panel { background:var(--chrome); border:1px solid var(--rule-2); border-radius:10px; overflow:clip; min-width:0; }
.skel { height:12px; border-radius:4px; background:var(--well); animation:skel 1.4s ease-in-out infinite alternate; max-width:520px; }
.skel.w40{width:160px} .skel.w60{width:240px} .skel.w80{width:320px}
@keyframes skel { from{opacity:.55} to{opacity:1} }
.facts { margin:0; padding-left:18px; color:var(--ink-2); display:grid; gap:2px; }
.scrim { position:fixed; inset:0; background:var(--scrim); z-index:40; }
.dialog { background:var(--raised); border:1px solid var(--rule); border-radius:10px; padding:16px; display:grid; gap:12px; box-shadow:var(--lift); }
#toast { position:fixed; left:0; right:0; margin:0 auto; width:fit-content; bottom:max(16px, env(safe-area-inset-bottom, 0px)); z-index:60; background:var(--raised); color:var(--ink); border:1px solid var(--rule); border-radius:6px; padding:10px 14px; box-shadow:var(--lift); max-width:calc(100vw - 32px); }
.tbl { overflow-x:auto; border:1px solid var(--rule-2); border-radius:6px; }
.tbl table { border-collapse:collapse; min-width:600px; width:max-content; max-width:none; }
.tbl th, .tbl td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--rule-2); vertical-align:top; }
.tbl th { font-weight:600; color:var(--ink-3); font-size:12.5px; background:var(--chrome); }
.tbl tr:last-child td { border-bottom:0; }
.seg { display:flex; flex-wrap:wrap; gap:6px; }
.acts { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

/* Ljuska: bočna traka 64 px (D-202); ispod 800 px gornja crta s "Izbornik". */
.shell { display:grid; grid-template-columns:64px minmax(0,1fr); }
.side { background:var(--chrome); border-right:1px solid var(--rule-2); padding:14px 4px; display:flex; flex-direction:column; gap:14px; position:sticky; top:0; align-self:start; height:calc(100vh - 44px); height:calc(100dvh - 44px); }
.side .brand { display:grid; place-items:center; min-height:44px; color:var(--ink); text-decoration:none; font:500 24px/1 var(--ff-display); }
.side .brand .word { display:none; }
.side nav { display:grid; gap:4px; }
.side nav a { display:grid; place-items:center; text-align:center; min-height:44px; padding:6px 2px; border-radius:5px; color:var(--ink-2); text-decoration:none; font-size:11px; line-height:1.2; }
.side nav a:hover { background:var(--hover); }
.side nav a[aria-current="page"] { background:var(--well); color:var(--ink); font-weight:600; }
.side-foot { margin-top:auto; display:grid; gap:6px; }
.side-foot .btn { padding:0 2px; font-size:11px; }
.side .menu { display:none; }
.main { max-width:960px; margin:0 auto; padding:24px 24px 56px; display:grid; gap:20px; align-content:start; min-width:0; }
.main > * { min-width:0; }
.main.narrow { max-width:680px; }
.pagehead { display:flex; justify-content:space-between; align-items:flex-end; gap:8px 16px; flex-wrap:wrap; }
.pagehead h1 { font-size:30px; }
.pagehead .lede { flex-basis:100vw; max-width:68ch; }
@media (max-width:800px) {
  .shell { grid-template-columns:minmax(0,1fr); grid-template-rows:auto 1fr; }
  .side { flex-direction:row; flex-wrap:wrap; justify-content:space-between; align-items:center; border-right:0; border-bottom:1px solid var(--rule-2); padding:8px var(--gutter-r) 8px var(--gutter-l); height:auto; z-index:5; }
  .side nav, .side-foot { display:none; flex-basis:100vw; }
  .side[data-open="true"] nav { display:grid; }
  .side[data-open="true"] nav a { place-items:center start; padding:6px 10px; font-size:13.5px; }
  .side[data-open="true"] .side-foot { display:flex; margin:0; }
  .side[data-open="true"] .side-foot .btn { padding:0 12px; font-size:13.5px; }
  .side .brand .mark { display:none; } .side .brand .word { display:inline; font-size:19px; }
  .side .menu { display:inline-flex; }
}
@media (max-width:640px) { .main { padding:16px var(--gutter-r) 40px var(--gutter-l); } .card { padding:16px; } .pagehead h1 { font-size:24px; } }

/* Stranice rada (bez bočne trake): traka s povratkom, kao u studentskom prototipu. */
.sb-wrap { display:grid; grid-template-rows:auto 1fr; }
.sb-bar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:4px 12px; flex-wrap:wrap; padding:6px var(--gutter-r) 6px var(--gutter-l); background:var(--chrome); border-bottom:1px solid var(--rule-2); }
.sb-bar .btn { min-height:44px; padding:0 10px; }
.sb-crumb { color:var(--ink-3); font-size:12.5px; min-width:0; overflow-wrap:anywhere; flex:1 1 200px; }
.sb-crumb b { color:var(--ink-2); font-weight:600; }
.sb-page { max-width:760px; margin:0 auto; padding:24px 24px 56px; display:grid; gap:20px; align-content:start; min-width:0; }
.sb-page > * { min-width:0; }
.sb-page.sb-two, .sb-page.wide { max-width:1160px; }
@media (min-width:1050px) { .sb-two { grid-template-columns:minmax(0,440px) minmax(0,1fr); align-items:start; } .sb-two > .sb-stick { position:sticky; top:72px; } .sb-two > .span { grid-column:1 / -1; } }
.sb-top { display:flex; justify-content:space-between; align-items:center; gap:8px 12px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--rule-2); }
.sb-top h1, .sb-top h2 { font-size:19px; min-width:0; }
.sb-body { padding:14px 16px 16px; display:grid; gap:12px; min-width:0; }
.sb-panel a:not(.btn) { display:inline-flex; align-items:center; min-height:44px; min-width:44px; justify-self:start; }
.sb-state { display:grid; gap:2px; border-top:1px solid var(--rule-2); padding-top:8px; min-width:0; }
.sb-state > .sb-h { font-weight:600; }
.sb-state h3 { font:600 13.5px/1.4 var(--ff-ui); letter-spacing:0; }
.sb-state ul.sb-places { margin:0; padding-left:18px; }
.sb-kv { display:flex; justify-content:space-between; gap:12px; }
.sb-kv b { font:500 13.5px/1.4 var(--ff-mono); text-align:right; }
.sb-ev { display:flex; justify-content:space-between; align-items:baseline; gap:4px 8px; flex-wrap:wrap; }
.sb-acts { display:flex; flex-wrap:wrap; gap:8px; }
.sb-mono { font:12.5px/1.5 var(--ff-mono); overflow-wrap:anywhere; }
.sb-decl { border:1px solid var(--rule-2); border-radius:6px; padding:10px 12px; display:grid; gap:6px; background:var(--card); min-width:0; }
.sb-decl.own { border-style:dashed; border-color:var(--rule); background:transparent; }
.sb-decl h3 { font:600 13.5px/1.4 var(--ff-ui); letter-spacing:0; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.sb-body > h2, .sb-body > h3.sb-sub { font:500 16px/1.3 var(--ff-display); }
.sb-entry { border-left:2px solid var(--rule); padding:2px 0 2px 10px; display:grid; gap:2px; }
.sb-entry .sb-who { font-size:12.5px; color:var(--ink-3); }
.sb-quote { margin:0; padding-left:10px; border-left:2px solid var(--rule); color:var(--ink-2); font-family:var(--ff-display); }
.sb-check { display:flex; gap:10px; align-items:center; min-height:44px; cursor:pointer; }
.sb-body details summary, .card details summary { cursor:pointer; padding:10px 0; min-height:44px; }
.sb-qr { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.sb-qr svg { width:96px; height:96px; flex:none; background:var(--sheet); border:1px solid var(--rule-2); border-radius:4px; padding:6px; color:var(--ink); }
.sb-qr .meta { max-width:36ch; }
.sb-dlg-host { position:fixed; inset:0; z-index:41; display:grid; place-items:center; padding:16px var(--gutter-r) 16px var(--gutter-l); pointer-events:none; }
.sb-dlg-host .dialog { pointer-events:auto; width:min(520px, calc(100vw - 32px)); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow:auto; }
.sb-dlg-host .dialog h2 { font-size:19px; }
.sb-spin { display:inline-block; width:12px; height:12px; border:2px solid currentColor; border-right-color:transparent; border-radius:999px; animation:sb-spin .8s linear infinite; }
@keyframes sb-spin { to { transform:rotate(360deg); } }
@media (max-width:640px) {
  .sb-page { padding:16px var(--gutter-r) 40px var(--gutter-l); gap:16px; }
  .sb-acts .btn, .acts .btn { flex:1 1 auto; }
  .sb-kv { flex-direction:column; gap:0; }
  .sb-kv b { text-align:left; }
}

/* N-01 kolegiji */
.course h2 { font-size:22px; }
.course .kv { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:8px 16px; }
.course .kv div { display:grid; gap:0; } .course .kv span { color:var(--ink-3); font-size:12.5px; }
.task { border-top:1px solid var(--rule-2); padding-top:12px; display:grid; gap:8px; }
.task h3, .task h2 { font:600 15px/1.35 var(--ff-ui); letter-spacing:0; }
.sub-row { display:flex; justify-content:space-between; align-items:center; gap:4px 12px; flex-wrap:wrap; border:1px solid var(--rule-2); border-radius:6px; padding:6px 6px 6px 12px; background:var(--ground); }
.sub-row .who { font-weight:600; }
.sub-row .facts-line { color:var(--ink-2); flex:1 1 260px; min-width:0; }
.code-once { font:500 22px/1.2 var(--ff-mono); letter-spacing:.08em; border:1px dashed var(--accent); border-radius:6px; padding:10px 14px; justify-self:start; }

/* N-03 zadatak: jedan obrazac u odjeljcima */
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
.opt { display:flex; gap:10px; align-items:flex-start; min-height:44px; padding:8px 0; cursor:pointer; }
.opt input { margin-top:2px; }
fieldset { border:1px solid var(--rule-2); border-radius:6px; padding:10px 12px; margin:0; display:grid; gap:2px; min-width:0; }
legend { font-weight:600; padding:0 4px; }

/* N-05 brz put */
.fp { display:grid; gap:16px; }
@media (min-width:1000px) { .fp { grid-template-columns:260px minmax(0,1fr); align-items:start; } }
.fp-list a { display:flex; flex-direction:column; justify-content:center; min-height:44px; padding:6px 10px; border-radius:5px; color:var(--ink); text-decoration:none; border:1px solid transparent; }
.fp-list a[aria-current="true"] { background:var(--well); border-color:var(--rule); font-weight:600; }
.fp-list a span { font-weight:400; color:var(--ink-3); font-size:12.5px; }
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--rule-2); flex-wrap:wrap; }
.tabs button { min-height:44px; padding:0 12px; background:transparent; border:0; border-bottom:2px solid transparent; color:var(--ink-2); }
.tabs button[aria-selected="true"] { color:var(--ink); font-weight:600; border-bottom-color:var(--accent); }

/* N-06/N-07 rad */
.rd-head { display:grid; gap:10px; padding:14px 16px; }
.rd-head h1 { font-size:24px; }
.rd-links { display:flex; flex-wrap:wrap; gap:0 14px; }
.rd-links a { display:inline-flex; align-items:center; min-height:44px; }
.rd-two { display:grid; gap:16px; }
@media (min-width:1050px) { .rd-two { grid-template-columns:minmax(0,1fr) 330px; align-items:start; } .rd-two > aside { position:sticky; top:72px; } }
.banner { background:var(--well); border-left:3px solid var(--accent); border-radius:6px; padding:10px 14px; display:grid; gap:8px; }
.banner.warn { border-left-color:var(--warn); }
.ed-sheet { border-radius:6px; padding:48px 64px 56px; font:16.5px/1.7 var(--ff-display); box-shadow:var(--lift); min-width:0; }
.ed-sheet h1 { font:500 24px/1.3 var(--ff-display); text-align:center; margin:0 0 6px; }
.ed-sheet .ed-sub { text-align:center; color:var(--ink-2); font-size:14px; margin:0 0 28px; }
.ed-sheet h2 { font:600 18px/1.4 var(--ff-display); margin:24px 0 8px; }
.ed-sheet p { margin:0 0 12px; text-align:justify; hyphens:auto; }

.ed-sheet .ed-mark { background:var(--cmt-bg); border-bottom:2px solid var(--cmt); }
.ed-sheet sup { color:var(--accent); font-size:11px; }
.ed-sheet .ed-notes { border-top:1px solid var(--rule); margin-top:28px; padding-top:8px; font-size:13.5px; color:var(--ink-2); }
.ed-sheet del { text-decoration:line-through; text-decoration-thickness:2px; }
.ed-sheet ins { text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; }
.ed-sheet .sug-lbl { font:600 11px/1 var(--ff-ui); color:var(--ink-2); border:1px solid var(--rule); border-radius:3px; padding:1px 4px; margin:0 2px; vertical-align:2px; }
.thread { display:grid; gap:8px; border:1px solid var(--rule-2); border-radius:6px; padding:10px 12px; background:var(--card); }
.thread.done { border-style:dashed; }
@media (max-width:640px) { .ed-sheet { padding:28px 18px 32px; border-radius:0; } .ed-sheet p { text-align:left; } .rd-head h1 { font-size:20px; } }

/* N-10 karta podrijetla: oblik crte i tekst, ne samo boja. */
.pv-legend { display:grid; gap:6px; margin:0; padding:0; list-style:none; }
.pv-legend li { display:flex; gap:10px; align-items:center; }
.pv-sw { display:inline-block; width:36px; height:12px; flex:none; }
.pv-paste, .pv-sw.paste { border-bottom:2px dashed var(--ink); }
.pv-ai, .pv-sw.ai { border-bottom:4px double var(--ink); }
.pv-imp, .pv-sw.imp { border-bottom:2px dotted var(--ink); }
.pv-teach, .pv-sw.teach { text-decoration:underline wavy var(--ink-2); text-underline-offset:4px; }
.pv-sw.teach { border-bottom:0; }
.pv-sw.open { border:1px dashed var(--ink-2); border-radius:3px; height:16px; }
.pv-sw.typed { border-left:3px solid var(--ink-3); }
.pv-l { font:600 11px/1 var(--ff-ui); color:var(--ink-2); border:1px solid var(--rule); border-radius:3px; padding:1px 4px; margin-left:4px; vertical-align:2px; white-space:nowrap; }
.pv-off .pv-paste, .pv-off .pv-ai, .pv-off .pv-imp { border-bottom:0; }
.pv-off .pv-l { display:none; }
.pv-typed-on p.pv-t { border-left:3px solid var(--ink-3); padding-left:10px; }
.switch { display:flex; gap:10px; align-items:center; min-height:44px; cursor:pointer; }

/* N-09 reprodukcija */
.rp-ctl { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; }
.rp-range { display:flex; gap:10px; align-items:center; }
.rp-range input { flex:1 1 auto; min-width:0; min-height:44px; accent-color:var(--accent); }
.rp-text .rp-new { background:var(--cmt-bg); border-bottom:2px solid var(--cmt); }
.rp-gap { border:1px dashed var(--rule); border-radius:4px; padding:8px 10px; font:13px/1.5 var(--ff-ui); color:var(--ink-2); }

/* N-11 usporedba */
.cmp ins { text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; }
.cmp del { text-decoration:line-through; text-decoration-thickness:2px; }
.cmp .w { font:600 11px/1 var(--ff-ui); color:var(--ink-2); margin:0 3px; }

        '<p class="meta">Zapise vide mentor i student. Dopunjuje ih samo mentor.</p><div class="sb-acts"><button class="btn" type="button" data-act="new">Novi zapis konzultacije</button></div>'));
    },
    actions: {
      new: function () { App.state.variant.konzultacije = 'novi'; App.rerender(); },
      list: function () { App.state.variant.konzultacije = 'puno'; App.rerender(); },
      open: function (el) { App.state.consOpen = +el.getAttribute('data-i'); App.state.variant.konzultacije = 'zapis'; App.rerender(); },
      addDop: function (form) {
        var t = form.dop.value.trim(); if (!t) { form.dop.setAttribute('aria-invalid', 'true'); form.dop.focus(); App.toast('Upišite dopunu.'); return; }
        var r = cons()[App.state.consOpen] || cons()[0]; (r.dop = r.dop || []).push({ who: 'Vi', at: '5. 11. 2026. u 21:50', t: t });
        App.rerender(); App.toast('Dopuna je dodana. Vidi je i student.');
      },
      save: function (form) {
        var t = form.t.value.trim(); if (!t) { form.t.setAttribute('aria-invalid', 'true'); form.t.focus(); App.toast('Upišite temu konzultacije.'); return; }
        cons().unshift({ d: form.d.value, t: t, ver: form.ver.value, dog: form.dog.value.trim() || 'Nije upisano.', dop: [] }); App.state.consOpen = 0;
        App.state.variant.konzultacije = 'zapis'; App.rerender(); App.toast('Konzultacija je zabilježena. Isti zapis vidi i student.');
      }
    }
  });

  /* ---------- N-13 Produljenje roka ---------- */
  var OLD_DUE = '8. 11. 2026. u 23:59';
  /* Popis razloga je primjer: odluka traži kratak popis općih razloga bez slobodnog teksta, a sam popis određuje ADR. */
  var EXT_REASONS = ['Opravdan razlog', 'Tehnička poteškoća', 'Dogovor s nastavnikom', 'Produljenje za sve'];
  function exts() { return App.state.ext || (App.state.ext = [{ who: 'Student D', to: '12. 11. 2026. u 23:59', reason: EXT_REASONS[0], at: '4. 11. 2026. u 9:20' }]); }
  App.register('produljenje', {
    title: 'N-13 Produljenje roka (gradnja čeka ADR)', shell: 'side', nav: 'kolegiji', narrow: true,
    note: ['N-13', 'gradi se, ali čeka', 'GRADNJA ČEKA ADR, rok 30. 11. 2026.; ovaj prikaz je oblik funkcije kao ulaz u ADR: jednom studentu ili svima, pokreće samo nastavnik, razlog s kratkog popisa bez slobodnog teksta (popis razloga ovdje je primjer), trag se ne briše'],
    variants: std([{ id: 'odobreno', label: 'produljenje zabilježeno' }, { id: 'za-sve', label: 'za sve studente' }, { id: 'sukob', label: 'student je već predao' }]),
    render: function (c) {
      var v = c.variant, title = 'Produljenje roka', lede = 'Seminarski rad „Lokalni mediji i izborna kampanja”, Kolegij A · rok 8. 11. 2026. u 23:59. Produljenje pokrećete samo Vi; student ga ne traži kroz Ducturu.';
      var s = sideState(v, title, lede, 'Učitavanje rokova…', 'Rokove trenutačno nije moguće učitati. Pokušajte ponovno.'); if (s) return s;
      var L = exts(), all = v === 'za-sve' || App.state.extFor === 'svi';
      var list = v === 'prazno' ? '<p class="note">Nijedan rok nije produljen.</p>' : '<ul class="list">' + L.map(function (e) { return '<li class="item"><span class="title">' + esc(e.who) + ' · novi rok ' + esc(e.to) + '</span><span class="meta">Stari rok ' + OLD_DUE + ' · razlog: ' + esc(e.reason) + ' · zabilježio Nastavnik A, ' + e.at + '</span></li>'; }).join('') + '</ul><p class="meta">Zapis o produljenju (stari i novi rok, tko i kada) se ne briše.</p>';
      var top = '';
      if (v === 'odobreno') top = '<div class="banner" role="status"><p><b>Produljenje je zabilježeno.</b> Student vidi novi rok uz zadatak. Razlog vidite samo Vi i taj student.</p></div>';
      if (v === 'sukob') top = '<div class="banner" role="status"><p><b>Student A je predaju zatražio 5. 11. 2026. u 21:14, prije ovog produljenja.</b> Produljenje ne mijenja tu predaju; bilježi se kao dopuna uz nju.</p></div>';
      var form = '<form class="card" data-submit="save" novalidate><fieldset><legend>Za koga</legend>' +
        '<label class="opt"><input type="radio" name="za" value="jedan"' + (all ? '' : ' checked') + ' data-za> Jedan student</label>' +
        '<label class="opt"><input type="radio" name="za" value="svi"' + (all ? ' checked' : '') + ' data-za> Svi studenti zadatka (4)</label></fieldset>' +
        (all ? '<p class="note">Novi rok vrijedi za sve studente zadatka. Studenti koji su već predali zadržavaju svoju predaju.</p>' :
          '<div class="field"><label for="f-ps">Student</label><select class="input" id="f-ps" name="st">' + T1.map(function (k) { return '<option' + ((v === 'sukob' ? k === 'a' : k === 'b') ? ' selected' : '') + '>' + W[k].who + '</option>'; }).join('') + '</select></div>') +
        '<div class="field"><label for="f-pr">Novi rok</label><input class="input" id="f-pr" name="rok" value="15. 11. 2026. u 23:59" aria-describedby="pr-h"><span class="meta" id="pr-h">Datum i sat po zagrebačkom vremenu (Europe/Zagreb).</span></div>' +
        '<div class="field"><label for="f-pz">Razlog</label><select class="input" id="f-pz" name="raz" aria-describedby="pz-h">' + EXT_REASONS.map(function (r) { return '<option>' + r + '</option>'; }).join('') + '</select><span class="meta" id="pz-h">Razlog se bira s popisa, bez slobodnog teksta. Vidite ga samo Vi i ' + (all ? 'studenti zadatka' : 'ovaj student') + '.</span></div>' +
        '<div class="sb-acts"><button class="btn" type="submit">Zabilježi produljenje</button><a class="btn secondary" href="#kolegiji" data-go="kolegiji">Odustani</a></div></form>';
      return head(title, lede) + top + form + '<section class="card" aria-labelledby="pl-h"><h2 id="pl-h">Produljeni rokovi</h2>' + list + '</section>';
    },
    actions: {
      save: function (form) {
        var r = form.raz.value;
        var all = form.querySelector('input[name="za"]:checked').value === 'svi';
        exts().unshift({ who: all ? 'Svi studenti zadatka' : form.st.value, to: form.rok.value, reason: r, at: '5. 11. 2026. u 21:45' });
        App.state.variant.produljenje = 'odobreno'; App.rerender();
      }
    },
    after: function (stage) {
      Array.prototype.forEach.call(stage.querySelectorAll('[data-za]'), function (r) {
        r.addEventListener('change', function () { App.state.extFor = r.value; if (App.variant() === 'za-sve') App.state.variant.produljenje = 'puno'; App.rerender(); var x = document.querySelector('[data-za][value="' + r.value + '"]'); if (x) x.focus(); });
      });
    }
  });

  /* ---------- N-18 Izvoz i paket za Merlin ---------- */
  function fname(k) { return 'prezime-' + W[k].who.slice(-1).toLowerCase() + '_' + (W[k].task === 't0' ? 'prikaz-clanka' : 'lokalni-mediji'); }
  App.register('izvoz', {
    title: 'N-18 Izvoz za Merlin', shell: 'side', nav: 'kolegiji',
    note: ['N-18', 'gradi se, ali čeka', 'gradi se nakon rada, potvrde predaje i Brzog puta; smije čekati (nije uvjet probe 22. 2. 2027.); jedan paket (.zip) po zadatku, poveznica 24 h; „Preuzmi samo popis”; na ekranu otisak paketa i Kopiraj, otisci datoteka su u CSV-u i u zasebnoj datoteci; CSV stupci po D-286, dopunjeni s dva stupca otiska: „otisak PDF” i „otisak .docx”'],
    variants: std([{ id: 'priprema', label: 'paket se priprema' }, { id: 'spreman', label: 'paket spreman' }]),
    render: function (c) {
      var v = c.variant, title = 'Izvoz za Merlin', lede = 'Jedan paket (.zip) po zadatku: PDF i .docx svakog predanog rada i CSV popis. Ocjena se upisuje u Merlinu.';
      var s = sideState(v, title, lede, 'Učitavanje predaja…', 'Predaje trenutačno nije moguće učitati. Pokušajte ponovno.'); if (s) return s;
      var tk = App.state.exp, keys = (tk === 't0' ? T0 : T1);
      var sel = '<div class="field" style="max-width:420px"><label for="f-ex">Zadatak</label><select class="input" id="f-ex" data-exp><option value="t0"' + (tk === 't0' ? ' selected' : '') + '>Esej „Prikaz članka” · rok je prošao</option><option value="t1"' + (tk === 't1' ? ' selected' : '') + '>Seminarski rad „Lokalni mediji i izborna kampanja”</option></select></div>';
      if (v === 'prazno') return head(title, lede) + sel + '<section class="card center"><h2>Nema predanih radova</h2><p class="note">Paket se može pripremiti kad bude barem jedan predani rad.</p></section>';
      var csv = '<div class="tbl" tabindex="0" role="region" aria-label="CSV popis"><table><thead><tr><th scope="col">Prezime</th><th scope="col">Ime</th><th scope="col">Predano</th><th scope="col">Vrijeme predaje</th><th scope="col">Nakon roka</th><th scope="col">Naziv datoteke u zipu</th><th scope="col">Otisak PDF</th><th scope="col">Otisak .docx</th></tr></thead><tbody>' +
        keys.map(function (k) { var w = W[k], p = w.st === 'predano'; return '<tr><td>' + w.who.slice(-1) + '</td><td>Student</td><td>' + (p ? 'da' : 'ne') + '</td><td>' + (w.sub || 'nema') + '</td><td>' + (p ? (late(k) ? 'da' : 'ne') : 'nema') + '</td><td class="mono">' + (p ? fname(k) + '.pdf' : 'nema') + '</td><td class="mono">' + (p ? hex('pdf' + k) : 'nema') + '</td><td class="mono">' + (p ? hex('docx' + k) : 'nema') + '</td></tr>'; }).join('') + '</tbody></table></div>';
      var zipHash = hex('zip' + tk);
      var status = v === 'priprema' ? '<p class="note" role="status"><span class="sb-spin" aria-hidden="true"></span> Paket se priprema. Možete napustiti stranicu; paket ostaje u pripremi.</p>'
        : v === 'spreman' ? '<div class="banner" role="status"><p><b>Paket je spreman.</b> Jedan paket (.zip) za odabrani zadatak. Poveznica vrijedi 24 h, do 6. 11. 2026. u 21:50.</p>' +
          '<div class="sb-state"><span class="sb-h">Otisak paketa</span><span class="sb-mono">' + zipHash.match(/.{4}/g).join(' ') + '</span><span class="meta">Niz znakova izračunan iz točnog sadržaja paketa. Ako se paket promijeni, otisak više nije isti.</span></div>' +
          '<div class="acts"><button class="btn" type="button" data-act="dl">Preuzmi paket</button><button class="btn secondary" type="button" data-act="copyHash" data-hash="' + zipHash + '">Kopiraj otisak</button></div></div>' : '';
      return head(title, lede) + sel + status +
        '<section class="card"><h2>Popis (CSV)</h2>' + csv + '<p class="meta">Svi studenti zadatka, po prezimenu; studenti bez predaje imaju „predano: ne”. Naziv datoteke u zipu je isti u CSV-u i u paketu. Stupci „otisak PDF” i „otisak .docx” su otisci PDF i .docx datoteke rada; studenti bez predaje imaju „nema” u oba.</p></section>' +
        '<section class="card"><h2>Otisci</h2><p class="note">Otisci pojedinih datoteka nalaze se u CSV popisu i u zasebnoj datoteci u paketu. Na ovom ekranu prikazuje se otisak paketa kad je paket spreman.</p><p class="note">Otisak pokazuje da datoteka nije mijenjana od predaje; ne govori ništa o autorstvu.</p><p class="meta">Priprema i preuzimanje paketa upisuju se u trag.</p></section>' +
        '<div class="acts"><button class="btn" type="button" data-act="prep"' + (v === 'priprema' ? ' aria-disabled="true"' : '') + '>Pripremi paket za Merlin</button><button class="btn secondary" type="button" data-act="csv">Preuzmi samo popis</button></div>';
    },
    actions: {
      prep: function () { App.toast('Priprema paketa za Merlin u prototipu nije izvedena.'); },
      dl: function () { App.toast('Preuzimanje paketa u prototipu nije izvedeno.'); },
      csv: function () { App.toast('Preuzimanje popisa (CSV) u prototipu nije izvedeno.'); },
      copyHash: function (el) { var h = el.getAttribute('data-hash'); try { if (navigator.clipboard) navigator.clipboard.writeText(h).catch(function () {}); } catch (e) {} App.toast('Otisak paketa je u međuspremniku (64 znaka, bez razmaka).'); }
    },
    after: function (stage) { var s = stage.querySelector('[data-exp]'); if (s) s.addEventListener('change', function () { App.state.exp = s.value; App.rerender(); var x = document.getElementById('f-ex'); if (x) x.focus(); }); }
  });

  /* Odluke od 18. 11. 2026.: N-14 Priprema za razgovor se sada ne gradi (uvjetan, EQ5); N-15 Etape nema zaseban ekran,
     slijed je u zaglavlju rada; N-AI-ATT AI pomoć u radu čeka Q-10 (15. 12. 2026.) i studentsku izjavu (M9).
     Ti ekrani nisu u prototipu, nemaju stavku navigacije ni poveznicu; u popisu ekrana stoje samo kao napomena (LATER). */
})();
</script>
