name: UI
# @ductura/ui and its catalogue (DAN-750, web 2.c1): typecheck, unit tests,
# visual baselines and axe. ci.yml keeps the npm skeleton until 2.c3 / E-0.3.
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Unit tests (tokens, provenance, save state, catalogue coverage)
        run: pnpm -r run test
      - name: Browser
        run: pnpm --filter @ductura/catalog exec playwright install --with-deps chromium
      - name: Visual and axe tests of the catalogue
        run: pnpm --filter @ductura/catalog run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: catalog-report, path: catalog/test-results/ }
