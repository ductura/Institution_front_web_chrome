name: CI
on:
  push: { branches: [main, "migracija/kopija-ductus-front"] }
  pull_request:
  # Full e2e matrix once a day (a pull request runs chromium, firefox and webkit). The
  # schedule runs on the default branch main only. Every job also by hand
  # (ZEL-CI-RED).
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same PR cancels the older run, so runners are not spent on
# commits nobody will merge (Daniel, 22. 11. 2026: speed up). The same holds for
# a push to the migration base (ZEL-CI-RED, Daniel 24. 11. 2026: less waiting
# in the queue): only the newest base commit is checked, so two quick merges do
# not run two full sets of jobs against the org's limit of 20 at once. A push
# to main is never cancelled. The schedule and a run by hand have groups of
# their own, so they never cancel a push and a push never cancels them.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/migracija/kopija-ductus-front') }}
jobs:
  # Which jobs a change needs (Daniel, 22. 11. 2026: skip what a change cannot
  # touch). A push to the base, a change to a root file (package.json, the
  # lockfiles, pnpm-workspace.yaml, playwright and tsconfig), to .github/ (this
  # file included), or a diff that cannot be read, runs EVERY job. Otherwise a
  # job runs when a path it reads changed. src/ feeds ui (pnpm -r runs the
  # tests of every workspace package) and app (it imports src/), so a change
  # there runs both. The build steps of this job (`app-build`) follow `app`
  # and `sistem`; the client checks run in the ui part `checks` and every path
  # of `client` also turns `ui` on.
  # `baselines` (report only, outside ci-ok) is on for a push, a run by hand
  # and the schedule (main only). On a pull request it is on only when the
  # pull request changes the catalogue or packages/ui/, what the baselines
  # show; a root file, .github/ or a failed diff does not turn it on
  # (CI-BRZINA, Daniel 25. 11. 2026): its three runners go to the checks
  # ci-ok waits for.
  #
  # These rules only fit checks that read the paths they list. A check that
  # reads the whole repository (the index, every tracked file, the lockfiles)
  # can be broken by a change in any path, so it must not hide behind these
  # rules: run it as a step of this job, which has no `if` and needs nothing,
  # like the CRLF check below, or make every path it reads turn its job on
  # here (ZEL-W20a, review of #435).
  #
  # The CRLF check of the index (DAN-952) is a step of this job since
  # ZEL-CI-RED: one runner less per run, a few seconds more here. It runs on
  # EVERY event; a CRLF file fails `changes`, so every other job is skipped
  # and ci-ok fails ("job changes result: failure").
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      test: ${{ steps.paths.outputs.test }}
      client: ${{ steps.paths.outputs.client }}
      ui: ${{ steps.paths.outputs.ui }}
      app: ${{ steps.paths.outputs.app }}
      app-build: ${{ steps.paths.outputs.app-build }}
      baselines: ${{ steps.paths.outputs.baselines }}
      sistem: ${{ steps.paths.outputs.sistem }}
    steps:
      # Depth 2 is enough: on a pull request HEAD is the merge commit and the
      # base sha is its first parent. If the base moved after the merge commit
      # was made, the base sha is missing, the diff fails and the filter below
      # runs every job (the safe side).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, persist-credentials: false }
      - name: Which jobs does this change need
        id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # changes:begin
          set -uo pipefail
          emit() { printf 'test=%s\nclient=%s\nui=%s\napp=%s\napp-build=%s\nbaselines=%s\nsistem=%s\n' "$1" "$2" "$3" "$4" "$4" "$5" "$6" | tee -a "$GITHUB_OUTPUT"; }
          all() { b=true; [ "$EVENT" != "pull_request" ] || b=false; echo "changes: running every job ($1)"; emit true true true true "$b" true; exit 0; }
          [ "$EVENT" = "pull_request" ] || all "not a pull request"
          [ -n "$BASE" ] || all "no base sha"
          # If the base moved after the merge commit was made, the base sha is
          # not in this depth-2 checkout and the diff fails. HEAD is then still
          # the merge commit, and its first parent is the base it was made on:
          # that diff is exactly this change. Anything else runs every job.
          if ! files="$(git diff --name-only "$BASE" HEAD 2>/dev/null)"; then
            [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] || all "diff failed"
            files="$(git diff --name-only HEAD^1 HEAD)" || all "diff failed"
            echo "changes: base sha not in the checkout, diffing the merge commit's first parent"
          fi
          [ -n "$files" ] || all "empty diff"
          # Root files, .github/, the lockfiles and the workspace file.
          # Root markdown files are documentation: they need no job.
          if grep -Ev '^[^/]+\.md$' <<< "$files" | grep -Eq '^([^/]+|\.github/.*)$'; then all "root file or .github/"; fi
          hit() { if grep -Eq "$1" <<< "$files"; then echo true; else echo false; fi; }
          t=false
          if grep -Ev '^src/client/' <<< "$files" | grep -Eq '^(src/|test/|tests/|e2e/|locales/|config/|public/|scripts/)'; then t=true; fi
          c="$(hit '^(src/client/|packages/editor-core/)')"
          u="$(hit '^(packages/|catalog/|src/|scripts/forbidden-terms/|locales/)')"
          a="$(hit '^(packages/|src/|locales/)')"
          b="$(hit '^(catalog/|packages/ui/)')"
          s="$(hit '^(packages/app/src/host/editor/|e2e/sistem/|playwright\.sistem\.config\.ts$|src/client/migration-contract)')"
          emit "$t" "$c" "$u" "$a" "$b" "$s"
          # changes:end
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      # No CRLF in the index (DAN-952), on every event (ZEL-W20a): a CRLF file
      # can come in any path, also docs/, packages/, catalog/ or a .md file
      # that the step above sends to no job. Node's own test runner and git
      # only, no install.
      - name: No tracked text file has CRLF in the index
        shell: bash
        run: |
          # line-endings:begin
          set -euo pipefail
          node --test test/unit/gitattributes.test.js
          # line-endings:end
      # The host build for the app shards and the system pass, in this job
      # since CI-RED-KARIKE (Daniel 27. 11. 2026: CI waits for runners, not
      # for work): a job of its own was one more wait for a runner on the
      # longest path changes -> build -> app -> ci-ok. The app shards
      # download this build instead of building the host again; the system
      # pass downloads it too (about 55 s) and patches the server URL baked
      # into the rewrites. A failed build fails `changes`, and so ci-ok.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.paths.outputs.app-build == 'true' || steps.paths.outputs.sistem == 'true'
        with: { version: 10.33.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.paths.outputs.app-build == 'true' || steps.paths.outputs.sistem == 'true'
        with: { node-version: 22, cache: pnpm }
      - if: steps.paths.outputs.app-build == 'true' || steps.paths.outputs.sistem == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install src/client
        if: steps.paths.outputs.app-build == 'true' || steps.paths.outputs.sistem == 'true'
        working-directory: src/client
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Build
        if: steps.paths.outputs.app-build == 'true' || steps.paths.outputs.sistem == 'true'
        env:
          INSTITUTION_SERVER_URL: http://127.0.0.1:9
        run: pnpm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.paths.outputs.app-build == 'true' || steps.paths.outputs.sistem == 'true'
        with:
          name: app-build
          path: |
            packages/app/.next
            !packages/app/.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  test:
    needs: changes
    if: ${{ needs.changes.outputs.test == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10.33.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Testovi pomoćnih funkcija
        run: pnpm run test:helpers
      # Preglednici iz predmemorije, kao u ui i app (ZEL-CI-WEB): ključ je
      # verzija Playwrighta i skup preglednika. Koraci instalacije ostaju isti;
      # s predmemorijom `playwright install` ne preuzima ponovno, a --with-deps
      # i dalje postavlja sistemske pakete. Chrome i Edge nisu u ovoj mapi i
      # instaliraju se kao i prije.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-root-${{ github.event_name == 'pull_request' && 'engines' || 'matrix' }}
      # e2e matrica (DAN-755): svi preglednici matrice; chrome i msedge su
      # pravi Google Chrome i Microsoft Edge, obvezni u CI-ju. Na pull
      # requestu chromium, firefox i webkit (PM2-R13, plan M0.3); chrome, edge i
      # mobilna emulacija samo na push (baza, main) i na noćnom rasporedu.
      - name: Instalacija preglednika
        if: ${{ github.event_name != 'pull_request' }}
        run: pnpm exec playwright install --with-deps chromium chrome msedge firefox webkit
      - name: Instalacija preglednika (pull request, chromium, firefox, webkit)
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Funkcionalni testovi
        env:
          DUCTURA_PR_ENGINES: ${{ github.event_name == 'pull_request' }}
        run: pnpm run test:functional
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-report, path: test-results/ }
  # @ductura/ui and its catalogue (DAN-750, web 2.c1): typecheck, unit tests,
  # visual baselines and axe. Moved from ui.yml so ci-ok can need it (DAN-885).
  # The ui job runs as parts of one matrix job, each on its own runner:
  # axe is CPU-bound (#461), so the six full-page checks were serial on one
  # runner and the job took 12 to 15 minutes. The checks, rules, themes and
  # widths are unchanged; only where they run changes. ci-ok needs `ui`, whose
  # result is success only when every part succeeded. The checks are two parts
  # (ZEL-CI-WEB): `checks` (typecheck and the coverage check of the parts) and
  # `unit` (the unit tests of every workspace package); only the browser parts
  # (`browser: true`) install a browser.
  #
  # The unit tests run in two legs (CI-BRZINA, 25. 11.): pnpm -r ran the eleven
  # packages on one four-core runner in about 3 minutes, CPU-bound. Leg 1 runs
  # the packages under src/, leg 2 every other one; the two pnpm filters are
  # each other's complement, so every package runs in exactly one leg. `!{.}`
  # keeps the workspace root out of both, as pnpm -r did: with a negative
  # filter pnpm 10 would otherwise select the root and run its browser tests.
  #
  # The part `checks` also runs the checks of src/client (DAN-752, web 2.c3:
  # the client generated from @ductura/contracts) when `changes` says `client`
  # (ZEL-CI-RED): before, they were a job of their own that took a runner for
  # 35 to 45 s. Every path of `client` also turns `ui` on, so they never run
  # nowhere; a failure fails `ui` and with it ci-ok. src/client is its own
  # package and lockfile and only this part reads GitHub Packages: the job
  # token, read only, is passed to its install step only, and no part keeps
  # git credentials after checkout.
  ui:
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    name: ui (${{ matrix.part }}${{ matrix.leg && format(' {0}/{1}', matrix.leg, matrix.of) || '' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # The behaviour tests run in three legs: one job of them took 8 of the 9
    # minutes of a PR's ci-ok. Ten "every state" tests of states.spec.ts take
    # about 2.5 minutes each and sit next to each other, so a Playwright shard
    # would get nine of them; the legs split them by width instead (4, 4 and
    # the 360 px pair with every other behaviour test). The coverage check below
    # proves each behaviour test runs in exactly one leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          # CI-WEB-NOGE: the unit tests are two legs of their own and `checks`
          # keeps only the typecheck. Measured per package (4 cores, seconds):
          # app 123, editor-core 45, components 31, client 19, forbidden-terms
          # 10, ui 9, catalog 4, every other src/ package 1 to 3. Leg 1 is
          # packages/app (about 123 s), leg 2 every other package (about 125
          # s); before, `unit` ran all of them in about 190 s next to a
          # `checks` that held the typecheck and the src/ tests. The two
          # filters are each other's complement, so every package still runs
          # in exactly one leg.
          - { part: checks }
          - { part: unit, leg: 1, of: 2, packages: "./packages/app" }
          - { part: unit, leg: 2, of: 2, packages: "!./packages/app" }
          - { part: behaviour, leg: 1, of: 3, browser: true }
          - { part: behaviour, leg: 2, of: 3, browser: true }
          - { part: behaviour, leg: 3, of: 3, browser: true }
          - { part: axe, browser: true }
    # One place for the filters: the parts below and the coverage check use them.
    env:
      BASELINES: "matches its baselines"
      AXE_ANY: "WCAG 2.2 AA violations"
      AXE_DARK: "dark shell has no WCAG 2.2 AA violations"
      AXE_LIGHT: "light shell has no WCAG 2.2 AA violations"
      STATES_1: "shell at (1440|1024) px: every state of every component"
      STATES_2: "shell at (768|390) px: every state of every component"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10.33.0 }
      # Only the part checks names the GitHub Packages registry of the
      # @ductura scope, as the client job did; an empty value sets none.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: ${{ matrix.part == 'checks' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ matrix.part == 'checks' && '@ductura' || '' }}
      - run: pnpm install --frozen-lockfile
      # packages/app imports src/client, its own package and lockfile; the
      # tarballs are public GitHub Releases, so no token.
      - name: Install src/client
        if: matrix.part != 'checks'
        working-directory: src/client
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Install src/client (GitHub Packages, read only)
        if: matrix.part == 'checks'
        working-directory: src/client
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore tsbuildinfo
      # CI-WEB-TSBUILD: tsc writes .tsbuildinfo (also with --noEmit) and on the
      # next run re-checks only the files whose content or whose imports'
      # content changed. The key holds the hash of the lockfile and of every
      # tsconfig, so a change of dependencies or compiler options starts cold;
      # tsc itself also drops the info when its options or version differ, and
      # a stale file only costs time, never a missed error. The sha suffix makes
      # every run save its own entry; restore-keys takes the newest of the same
      # configuration. Nothing is skipped: the same `typecheck` script runs in
      # every package, only with the two incremental flags added.
        if: matrix.part == 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            **/.tsbuildinfo
            !**/node_modules/**
          key: tsbuildinfo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json', '!**/node_modules/**') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', '**/tsconfig*.json', '!**/node_modules/**') }}-
      - name: Typecheck
        if: matrix.part == 'checks'
        run: pnpm -r run typecheck --incremental --tsBuildInfoFile .tsbuildinfo
      - name: Typecheck of src/client
        if: matrix.part == 'checks' && needs.changes.outputs.client == 'true'
        working-directory: src/client
        run: pnpm run typecheck
      - name: Tests of src/client (contract vectors, schema check, no direct API call, registry)
        if: matrix.part == 'checks' && needs.changes.outputs.client == 'true'
        working-directory: src/client
        run: pnpm run test
      - name: Unit tests (tokens, provenance, save state, catalogue coverage)
        if: matrix.packages
        env:
          PACKAGES: ${{ matrix.packages }}
        run: pnpm -r --filter "$PACKAGES" --filter "!{.}" run test
      # Every blocking catalogue test must run in exactly one part: a new axe
      # test outside both shell filters would otherwise run nowhere.
      - name: Every catalogue test runs in one part
        if: matrix.part == 'checks'
        run: |
          set -euo pipefail
          count() { pnpm --filter @ductura/catalog exec playwright test --list "$@" | grep -oP '^Total: \K[0-9]+' || echo 0; }
          all=$(count --grep-invert "$BASELINES")
          behaviour=$(count --grep-invert "$BASELINES|$AXE_ANY")
          dark=$(count --grep "$AXE_DARK")
          light=$(count --grep "$AXE_LIGHT")
          echo "all $all = behaviour $behaviour + axe dark $dark + axe light $light"
          if [ "$all" -eq 0 ] || [ $((behaviour + dark + light)) -ne "$all" ]; then
            echo "::error::the ui parts do not cover every catalogue test exactly once"
            exit 1
          fi
          leg1=$(count --grep-invert "$BASELINES|$AXE_ANY" --grep "$STATES_1")
          leg2=$(count --grep-invert "$BASELINES|$AXE_ANY" --grep "$STATES_2")
          leg3=$(count --grep-invert "$BASELINES|$AXE_ANY|$STATES_1|$STATES_2")
          echo "behaviour $behaviour = leg 1 $leg1 + leg 2 $leg2 + leg 3 $leg3"
          if [ "$leg1" -eq 0 ] || [ "$leg2" -eq 0 ] || [ $((leg1 + leg2 + leg3)) -ne "$behaviour" ]; then
            echo "::error::the behaviour legs do not cover every behaviour test exactly once"
            exit 1
          fi
      - name: Playwright version
        id: pw
        if: matrix.browser
        run: |
          echo "version=$(grep -m1 -oP "^  '@playwright/test@\K[0-9.]+(?=':)" pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Browser cache
        if: matrix.browser
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # The browser's system packages (ZEL-CI-RED): apt sometimes fetches the
      # same ~22 MB at 80 kB/s and the step takes 4 to 5 minutes. The .deb
      # files come from a cache (key: runner image and Playwright version), so
      # apt only installs them. apt-get update still runs and a package that
      # changed is still fetched, so the installed packages are the same.
      - name: System package cache
        if: matrix.browser
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-${{ runner.arch }}-${{ steps.pw.outputs.image }}-pw${{ steps.pw.outputs.version }}
          restore-keys: apt-${{ runner.arch }}-${{ steps.pw.outputs.os }}-
      - name: System packages from the cache
        if: matrix.browser
        run: |
          set -euo pipefail
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99ductura-keep-debs > /dev/null
          mkdir -p ~/.cache/apt-debs
          n=$(find ~/.cache/apt-debs -maxdepth 1 -name '*.deb' | wc -l)
          if [ "$n" -gt 0 ]; then sudo cp ~/.cache/apt-debs/*.deb /var/cache/apt/archives/; fi
          echo "apt cache: $n package file(s)"
      - name: Browser
        if: matrix.browser && steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ductura/catalog exec playwright install --with-deps chromium
      - name: Browser system dependencies (browser cached)
        if: matrix.browser && steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ductura/catalog exec playwright install-deps chromium
      - name: Keep the fetched system packages
        id: apt-keep
        if: matrix.browser
        run: |
          set -euo pipefail
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/apt-debs {} +
          echo "count=$(find ~/.cache/apt-debs -maxdepth 1 -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Save the system package cache
        if: matrix.browser && steps.apt-cache.outputs.cache-hit != 'true' && steps.apt-keep.outputs.count != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-${{ runner.arch }}-${{ steps.pw.outputs.image }}-pw${{ steps.pw.outputs.version }}
      - name: Behaviour tests of the catalogue
        if: matrix.part == 'behaviour'
        run: |
          set -euo pipefail
          case "${{ matrix.leg }}" in
            1) set -- --grep-invert "$BASELINES|$AXE_ANY" --grep "$STATES_1" ;;
            2) set -- --grep-invert "$BASELINES|$AXE_ANY" --grep "$STATES_2" ;;
            3) set -- --grep-invert "$BASELINES|$AXE_ANY|$STATES_1|$STATES_2" ;;
            *) echo "::error::unknown behaviour leg"; exit 1 ;;
          esac
          pnpm --filter @ductura/catalog run test:visual "$@"
      # One job for both shells (CI-BRZINA, 25. 11.): each took about a minute
      # of tests after a minute of setup, and a pull request run is at the
      # organisation's limit of concurrent runners. The light shell also runs
      # when the dark one failed, so a run reports both.
      - name: Axe tests of the catalogue (dark shell)
        if: matrix.part == 'axe'
        run: pnpm --filter @ductura/catalog run test:visual --grep "$AXE_DARK"
      - name: Axe tests of the catalogue (light shell)
        if: always() && matrix.part == 'axe'
        run: pnpm --filter @ductura/catalog run test:visual --grep "$AXE_LIGHT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: catalog-report-${{ matrix.part }}${{ matrix.leg }}
          path: catalog/test-results/

  # Daniel (22. 11. 2026): while the features are still being built, the pixel
  # baselines of the catalogue only report and do not block ci-ok; behaviour
  # and axe still block. They become required again with VIZ-0. A job of its
  # own outside ci-ok's needs (ZEL-CI-WEB), so ci-ok does not wait for a check
  # that cannot fail it; three Playwright shards. Listed in REPORT_ONLY in
  # test/unit/ci-ok.test.js. It runs when `changes` says `baselines`: on a
  # push (after a merge into main or the migration base), by hand and on the
  # schedule of main, and on a pull request only when it changes catalog/ or
  # packages/ui/ (CI-BRZINA, Daniel 25. 11. 2026): a pull request run already
  # holds about twenty jobs, the limit of the organisation's concurrent
  # runners, and these three only report.
  ui-baselines:
    needs: changes
    if: ${{ needs.changes.outputs.baselines == 'true' }}
    name: ui-baselines (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    env:
      BASELINES: "matches its baselines"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10.33.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install src/client
        working-directory: src/client
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Playwright version
        id: pw
        run: |
          echo "version=$(grep -m1 -oP "^  '@playwright/test@\K[0-9.]+(?=':)" pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Browser cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # The browser's system packages (ZEL-CI-RED): apt sometimes fetches the
      # same ~22 MB at 80 kB/s and the step takes 4 to 5 minutes. The .deb
      # files come from a cache (key: runner image and Playwright version), so
      # apt only installs them. apt-get update still runs and a package that
      # changed is still fetched, so the installed packages are the same.
      - name: System package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-${{ runner.arch }}-${{ steps.pw.outputs.image }}-pw${{ steps.pw.outputs.version }}
          restore-keys: apt-${{ runner.arch }}-${{ steps.pw.outputs.os }}-
      - name: System packages from the cache
        run: |
          set -euo pipefail
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99ductura-keep-debs > /dev/null
          mkdir -p ~/.cache/apt-debs
          n=$(find ~/.cache/apt-debs -maxdepth 1 -name '*.deb' | wc -l)
          if [ "$n" -gt 0 ]; then sudo cp ~/.cache/apt-debs/*.deb /var/cache/apt/archives/; fi
          echo "apt cache: $n package file(s)"
      - name: Browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ductura/catalog exec playwright install --with-deps chromium
      - name: Browser system dependencies (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ductura/catalog exec playwright install-deps chromium
      - name: Keep the fetched system packages
        id: apt-keep
        run: |
          set -euo pipefail
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/apt-debs {} +
          echo "count=$(find ~/.cache/apt-debs -maxdepth 1 -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Save the system package cache
        if: steps.apt-cache.outputs.cache-hit != 'true' && steps.apt-keep.outputs.count != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-${{ runner.arch }}-${{ steps.pw.outputs.image }}-pw${{ steps.pw.outputs.version }}
      - name: Visual baselines of the catalogue (report only)
        id: baselines
        continue-on-error: true
        run: pnpm --filter @ductura/catalog run test:visual --grep "$BASELINES" --shard="${{ matrix.shard }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.baselines.outcome == 'failure'
        with:
          name: catalog-baselines-${{ strategy.job-index }}
          path: catalog/test-results/

  # The institution front's host (#2028 c.6993786629 §1, §3.3): packages/app
  # built and served by dev-server.mjs under /aplikacija/, over a
  # fake institution server (page.route), with axe.
  #
  # The browser tests run as six shards of one job (ZEL-W23; six since
  # CI-BRZINA, 25. 11.). With four, the shards took 1.9 to 4.4 minutes of
  # tests: the slow tests (a11y and the assistant) come first alphabetically
  # and Playwright splits by test count, so shard 1 was the critical path of
  # the whole workflow. ci-ok needs the job `app`, whose result is success
  # only when every shard succeeded.
  app:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    name: app (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: 10.33.0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install src/client
        working-directory: src/client
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      # The build of the job changes: in CI the Playwright webServer only
      # starts it (packages/app/playwright.config.ts).
      - name: The built app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-build
          path: packages/app/.next
      - name: Playwright version
        id: pw
        run: |
          echo "version=$(grep -m1 -oP "^  '@playwright/test@\K[0-9.]+(?=':)" pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Browser cache
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      # The browser's system packages (ZEL-CI-RED): apt sometimes fetches the
      # same ~22 MB at 80 kB/s and the step takes 4 to 5 minutes. The .deb
      # files come from a cache (key: runner image and Playwright version), so
      # apt only installs them. apt-get update still runs and a package that
      # changed is still fetched, so the installed packages are the same.
      - name: System package cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-${{ runner.arch }}-${{ steps.pw.outputs.image }}-pw${{ steps.pw.outputs.version }}
          restore-keys: apt-${{ runner.arch }}-${{ steps.pw.outputs.os }}-
      - name: System packages from the cache
        run: |
          set -euo pipefail
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99ductura-keep-debs > /dev/null
          mkdir -p ~/.cache/apt-debs
          n=$(find ~/.cache/apt-debs -maxdepth 1 -name '*.deb' | wc -l)
          if [ "$n" -gt 0 ]; then sudo cp ~/.cache/apt-debs/*.deb /var/cache/apt/archives/; fi
          echo "apt cache: $n package file(s)"
      - name: Browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @ductura/app exec playwright install --with-deps chromium
      - name: Browser system dependencies (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @ductura/app exec playwright install-deps chromium
      - name: Keep the fetched system packages
        id: apt-keep
        run: |
          set -euo pipefail
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/apt-debs {} +
          echo "count=$(find ~/.cache/apt-debs -maxdepth 1 -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Save the system package cache
        if: steps.apt-cache.outputs.cache-hit != 'true' && steps.apt-keep.outputs.count != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-debs
          key: apt-${{ runner.arch }}-${{ steps.pw.outputs.image }}-pw${{ steps.pw.outputs.version }}
      - name: Session, routes and axe in the browser (shard ${{ matrix.shard }})
        run: pnpm --filter @ductura/app run test:e2e --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: "app-report-${{ strategy.job-index }}", path: packages/app/test-results/ }

  # The system pass on the real stack (INT-08, INT-10): sistem.yml as a
  # reusable workflow (Daniel 25. 11. 2026, option 1 on WEB#682). It runs on
  # every push to the base, on a pull request that changes the editor host,
  # e2e/sistem/ or its config, the contract extract src/client/migration-contract*
  # (ZEL-WEB-SISTEM-2711: a stale extract broke sistem unseen), and on
  # everything that runs every job.
  # ci-ok needs it.
  sistem:
    needs: changes
    if: ${{ needs.changes.outputs.sistem == 'true' }}
    uses: ./.github/workflows/sistem.yml
    with:
      build_artifact: true
    permissions:
      contents: read

  # The one required status (DAN-885): green only when every job above
  # succeeded; failure, cancelled, skipped or a missing result fails it.
  # A plain job, so the check is named exactly ci-ok.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [changes, test, ui, app, sistem]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # ci-ok:begin
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' >/dev/null 2>&1 <<< "$NEEDS"; then
            echo "::error::needs must be a non-empty JSON object"
            exit 1
          fi
          # A job may be skipped only when `changes` said, in its own output,
          # that the job is not needed ("false"). Everything that is not
          # success (failure, cancelled, an unexpected skip, a missing result)
          # fails, and so does `changes` itself.
          problems="$(jq -r '. as $n | to_entries[] | .key as $k
            | ((.value | objects | .result) // "missing") as $r
            | ((($n.changes | objects | .result) // "") == "success") as $changed
            | ((($n.changes | objects | .outputs | objects | .[$k]) // "") == "false") as $notNeeded
            | select($r != "success" and ($r != "skipped" or $k == "changes" or ($changed | not) or ($notNeeded | not)))
            | "job \($k) result: \($r)"' <<< "$NEEDS")"
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi
          echo "ci-ok: $(jq length <<< "$NEEDS") job(s) passed"
          # ci-ok:end
