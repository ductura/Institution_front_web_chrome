name: CI
on:
  push: { branches: [main, "migracija/kopija-ductus-front"] }
  pull_request:
permissions:
  contents: read
# A newer push to the same PR or branch cancels the older run, so runners are
# not spent on commits nobody will merge (Daniel, 22. 11. 2026: speed up).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Testovi pomoćnih funkcija
        run: npm run test:helpers
      # e2e matrica (DAN-755): svi preglednici matrice; chrome i msedge su
      # pravi Google Chrome i Microsoft Edge, obvezni u CI-ju.
      - name: Instalacija preglednika
        run: npx playwright install --with-deps chromium chrome msedge firefox webkit
      - name: Funkcionalni testovi
        run: npm run test:functional
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results/ }
  client:
    # src/client (DAN-752, web 2.c3): the client generated from @ductura/contracts.
    # Its own package and lockfile, so only this job reads GitHub Packages; the
    # job token, read only, is passed to the install step only.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@ductura'
      - run: npm install -g pnpm@10.33.0
      # The evidence modules reach packages/editor-core (drain runner, journal,
      # replayer) and with it @tiptap/* and dexie: the workspace install, as in
      # ui and app (WEB-38 2/2, Ductus#2028). No token.
      - name: Install workspace
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Install (GitHub Packages, read only)
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Typecheck
        run: pnpm run typecheck
      - name: Tests (contract vectors, schema check, no direct API call, registry)
        run: pnpm run test

  # @ductura/ui and its catalogue (DAN-750, web 2.c1): typecheck, unit tests,
  # visual baselines and axe. Moved from ui.yml so ci-ok can need it (DAN-885).
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      # packages/app imports src/client, its own package and lockfile; the
      # tarballs are public GitHub Releases, so no token.
      - name: Install src/client
        working-directory: src/client
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Unit tests (tokens, provenance, save state, catalogue coverage)
        run: pnpm -r run test
      - name: Browser
        run: pnpm --filter @ductura/catalog exec playwright install --with-deps chromium
      # Daniel (22. 11. 2026): while the features are still being built, the
      # pixel baselines only report and do not block ci-ok, and run only on
      # pushes to the base, not on PRs; behaviour and axe still block. They
      # become required again with VIZ-0.
      - name: Behaviour and axe tests of the catalogue
        run: pnpm --filter @ductura/catalog run test:visual --grep-invert "matches its baselines"
      - name: Visual baselines of the catalogue (report only)
        id: baselines
        if: github.event_name == 'push'
        continue-on-error: true
        run: pnpm --filter @ductura/catalog run test:visual --grep "matches its baselines"
      - uses: actions/upload-artifact@v4
        if: failure() || steps.baselines.outcome == 'failure'
        with: { name: catalog-report, path: catalog/test-results/ }

  # The institution front's host (#2028 c.6993786629 §1, §3.3): packages/app
  # built and served by dev-server.mjs under /app/web/ and /app/chrome/, over a
  # fake institution server (page.route), with axe.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g pnpm@10.33.0
      - run: pnpm install --frozen-lockfile
      - name: Install src/client
        working-directory: src/client
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Build
        run: pnpm run build
      - name: Browser
        run: pnpm --filter @ductura/app exec playwright install --with-deps chromium
      - name: Session, routes and axe in the browser
        run: pnpm --filter @ductura/app run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: app-report, path: packages/app/test-results/ }

  # The one required status (DAN-885): green only when every job above
  # succeeded; failure, cancelled, skipped or a missing result fails it.
  # A plain job, so the check is named exactly ci-ok.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [test, client, ui, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # ci-ok:begin
          set -euo pipefail
          if ! jq -e 'type == "object" and length > 0' >/dev/null 2>&1 <<< "$NEEDS"; then
            echo "::error::needs must be a non-empty JSON object"
            exit 1
          fi
          problems="$(jq -r 'to_entries[] | ((.value | objects | .result) // "missing") as $r
            | select($r != "success") | "job \(.key) result: \($r)"' <<< "$NEEDS")"
          if [ -n "$problems" ]; then
            while IFS= read -r line; do echo "::error::$line"; done <<< "$problems"
            exit 1
          fi
          echo "ci-ok: $(jq length <<< "$NEEDS") job(s) passed"
          # ci-ok:end
