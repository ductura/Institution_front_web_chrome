name: Sistem
# INT-08 i INT-10 (DAN-887): sistemski prolaz Faze 3 nad onim što se isporučuje.
# Na runneru se podiže stvarni stog: PostgreSQL s migracijama i seedom,
# Institution_server, lažni OIDC (simulator AAI@EduHr), izgradnja
# packages/app ovog repoa (`pnpm build` + `pnpm start`, ista izgradnja kao
# isporuka) i lokalni edge Preloadera na :8000 (`/` = Preloader, `/api/v1` =
# server, `/aplikacija` = packages/app). Student ulazi kroz `/`. Zatim
# `pnpm test:sistem` (INT-02..05 i INT-13, tok editora iz vala 1).
# Prijava je samo lažni OIDC (D-09), svi podaci su izmišljeni (demo seed),
# bez tajni.
# Okidači (Daniel 25. 11., opcija 1 na WEB#682): ci.yml ga poziva kao posao
# `sistem` (workflow_call), pa je dio ci-ok-a. `changes` u ci.yml ga uključuje
# na svaki push u bazu, na PR koji dira editor, e2e/sistem ili njegovu
# konfiguraciju, i na sve što pokreće svaki posao (korijen, .github/). Ručno:
# workflow_dispatch. Bez vlastitog concurrency-ja: otkazivanje vodi ci.yml.
on:
  workflow_call:
    inputs:
      server_ref:
        type: string
        default: migracija/kopija-ductus-backend
      preloader_ref:
        type: string
        default: migracija/nextjs
      # CI-WEB-NOGE: ci.yml passes true and the job takes the build of its
      # job `app-build` instead of building the host again (about 55 s).
      build_artifact:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      server_ref:
        description: Grana Institution_servera
        default: migracija/kopija-ductus-backend
      preloader_ref:
        description: Grana Preloadera
        default: migracija/nextjs
permissions:
  contents: read
jobs:
  sistem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STOG_FRONT_DIR: ${{ github.workspace }}/Institution_front_web_chrome
      STOG_SERVER_DIR: ${{ github.workspace }}/Institution_server
      STOG_PRELOADER_DIR: ${{ github.workspace }}/Preloader
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Institution_front_web_chrome
          persist-credentials: false
      # Public repos, no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ductura/Institution_server
          ref: ${{ inputs.server_ref || 'migracija/kopija-ductus-backend' }}
          path: Institution_server
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ductura/Preloader
          ref: ${{ inputs.preloader_ref || 'migracija/nextjs' }}
          path: Preloader
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm install -g pnpm@10.33.0
      - name: Install server
        working-directory: Institution_server
        run: pnpm install --frozen-lockfile
      - name: Install web
        working-directory: Institution_front_web_chrome
        run: pnpm install --frozen-lockfile
      - name: Install src/client
        working-directory: Institution_front_web_chrome/src/client
        run: pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts
      - name: Install Preloader
        working-directory: Preloader
        run: pnpm install --frozen-lockfile
      - name: Browser
        working-directory: Institution_front_web_chrome
        run: pnpm exec playwright install --with-deps chromium
      - name: SHAs
        run: |
          echo "SHA_WEB=$(git -C Institution_front_web_chrome rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHA_SERVER=$(git -C Institution_server rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHA_PRELOADER=$(git -C Preloader rev-parse HEAD)" >> "$GITHUB_ENV"
      # Isti koraci kao `pnpm stog:gore` (INT-01): PostgreSQL (Docker compose),
      # migracije, seed, simulator i server, s podrijetlom preglednika na edgeu
      # Preloadera (:8000), kao u Preloaderovu docs/LOKALNO.md.
      - name: "Stog gore (INT-01): baza, server, simulator"
        working-directory: Institution_server
        env:
          DATABASE_URL: postgres://ductus:ductus-local-only@127.0.0.1:54329/ductus
        run: |
          docker compose up -d --build --wait postgres-main
          nohup node scripts/lokalno/lokalno.ts --izvor=http://localhost:8000 > "$RUNNER_TEMP/stog.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4000/api/v1/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8090/.well-known/openid-configuration >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://127.0.0.1:4000/api/v1/health || { echo "::error::server se nije podigao"; tail -n 200 "$RUNNER_TEMP/stog.log"; exit 1; }
      # INT-10: isporučeni host je packages/app (`pnpm build` i `pnpm start` u
      # korijenu idu na @ductura/app), ne Next u src/app.
      # app-build builds with the fake server URL of the e2e (http://127.0.0.1:9),
      # which `next build` bakes into the rewrites of three files in .next. The
      # stack's server is :4000, so the URL is replaced there; the step fails if
      # the marker is missing or still present. OIDC_ISSUER is read when
      # `next start` runs (src/middleware.ts), so it needs no patch.
      - name: Front build from app-build
        if: ${{ inputs.build_artifact }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-build
          path: Institution_front_web_chrome/packages/app/.next
      - name: Point the downloaded build at the stack server
        if: ${{ inputs.build_artifact }}
        working-directory: Institution_front_web_chrome/packages/app/.next
        run: |
          set -euo pipefail
          for f in routes-manifest.json required-server-files.json required-server-files.js; do
            grep -q 'http://127.0.0.1:9\b' "$f" || { echo "::error::$f has no fake server URL"; exit 1; }
            sed -i 's#http://127.0.0.1:9\b#http://127.0.0.1:4000#g' "$f"
          done
          if grep -rIq 'http://127.0.0.1:9\b' .; then echo "::error::fake server URL left in the build"; exit 1; fi
      - name: "Front: packages/app (pnpm build + pnpm start)"
        working-directory: Institution_front_web_chrome
        env:
          INSTITUTION_SERVER_URL: http://127.0.0.1:4000
          # CSP form-action pušta 303 odjave na end_session lažnog OIDC-a (INT-20).
          OIDC_ISSUER: http://localhost:8090
          NEXT_TELEMETRY_DISABLED: "1"
          BUILD_ARTIFACT: ${{ inputs.build_artifact }}
        run: |
          if [ "$BUILD_ARTIFACT" != "true" ]; then pnpm build; fi
          nohup pnpm start > "$RUNNER_TEMP/front.log" 2>&1 &
          for i in $(seq 1 40); do curl -fsS -o /dev/null http://127.0.0.1:5173/aplikacija/stanje && break; sleep 3; done
          curl -fsS -o /dev/null http://127.0.0.1:5173/aplikacija/stanje || { tail -n 100 "$RUNNER_TEMP/front.log"; exit 1; }
      - name: "Preloader i edge (:8000)"
        working-directory: Preloader
        env:
          DUCTURA_EDGE_API: http://127.0.0.1:4000
          DUCTURA_EDGE_FRONT: http://127.0.0.1:5173
        run: |
          pnpm build
          # migracija/nextjs: the Preloader is a Next app on :3100 behind the
          # edge (main is a static build the edge serves itself).
          if node -e 'process.exit(require("./package.json").scripts?.start ? 0 : 1)'; then
            nohup pnpm start > "$RUNNER_TEMP/preloader.log" 2>&1 &
            for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3100/ && break; sleep 1; done
            curl -fsS -o /dev/null http://127.0.0.1:3100/ || { tail -n 60 "$RUNNER_TEMP/preloader.log"; exit 1; }
          fi
          nohup node deploy/edge/dev-proxy.mjs > "$RUNNER_TEMP/edge.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8000/ && break; sleep 1; done
          curl -fsS -o /dev/null http://localhost:8000/ || { cat "$RUNNER_TEMP/edge.log"; exit 1; }
          curl -fsS -o /dev/null http://localhost:8000/aplikacija/stanje
          curl -fsS http://localhost:8000/api/v1/health
      # VS-1.13: lokalno.ts gasi sve podprocese kad jedan izađe. Iste naredbe
      # s istom okolinom nastavljaju kao samostalni procesi, pa test smije
      # ugasiti i ponovno pokrenuti samo server.
      - name: Stog bez nadzornika (VS-1.13)
        run: node Institution_front_web_chrome/e2e/sistem/stog-bez-nadzora.mjs "$STOG_SERVER_DIR" "$RUNNER_TEMP/stog-procesi"
      - name: Procesi stoga
        run: |
          ss -ltnp | grep -E ':(4000|5173|8000|8090|4192) ' || true
          ps -eo pid,ppid,args --forest | grep -E 'node|pnpm' | grep -v grep || true
      - name: Seed INT-04
        working-directory: Institution_server
        run: docker compose exec -T postgres-main psql -U ductus -d ductus -v ON_ERROR_STOP=1 < ../Institution_front_web_chrome/e2e/sistem/seed-int04.sql
      - name: pnpm test:sistem
        working-directory: Institution_front_web_chrome
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/sistem-report.json
        run: pnpm test:sistem --reporter=list,json
      - name: Tablica i vs-run.json
        if: always()
        working-directory: Institution_front_web_chrome
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          node e2e/vs-run/vs-run.mjs "$RUNNER_TEMP/sistem-report.json" test-results/sistem/vs-1-vrijednosti.json "$RUNNER_TEMP/out" | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Dnevnici stoga
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/stog.log" "$RUNNER_TEMP/front.log" "$RUNNER_TEMP/edge.log" "$RUNNER_TEMP/preloader.log" "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/stog-procesi" "$RUNNER_TEMP/out/" 2>/dev/null || true
          ps -eo pid,ppid,args --forest | grep -E 'node|pnpm' | grep -v grep > "$RUNNER_TEMP/out/procesi.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sistem
          path: |
            ${{ runner.temp }}/out/
            Institution_front_web_chrome/test-results/sistem/
          if-no-files-found: warn
